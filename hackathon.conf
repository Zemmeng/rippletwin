# hackathon.conf -- event metadata; the single copy for the whole repository
# 🔒 Maintainer-only. Never put a key or token here (those go in .env or a wrangler secret).
# Times are local times in the TZ below (YYYY-MM-DD HH:MM), never a hard-coded UTC offset:
#   Melbourne switches to daylight saving on 2026-10-04 at 02:00, and the scripts compute it from TZ with python3 zoneinfo.
# The hooks, check.sh and deploy.sh read the countdown, freeze times, people and deploy targets from here.
# Two module tests also read DEPLOY_MODULES (apps/site and apps/sumo tests/config.test.mjs).

# Event name and website
EVENT_NAME=FEIT Hackathon Festival 2026
EVENT_URL=https://canvas.lms.unimelb.edu.au/courses/244146

# IANA time zone name, not an offset
TZ=Australia/Melbourne

# Start / deadline (local time). If DEADLINE is empty the scripts show "not set" instead of failing
START=2026-09-29 09:30
DEADLINE=2026-10-01 12:00

# Freezes: N hours before the deadline. 6/2 by default for a 48 h event; 4/1 suits a 24 h event
FEATURE_FREEZE_HOURS=6
CODE_FREEZE_HOURS=2

# People: GitHub handles, without @
LEAD=Zemmeng
BACKUP_LEAD=Zemmeng
DEPLOYER=unicornnnnnny

# Live URLs (the demo link at the top of README.md must match DEMO_URL; check [9] warns otherwise)
DEMO_URL=https://hackathon-site.zemmmeng.workers.dev
VIDEO_URL=https://youtu.be/tb_P3QXtKkw

# Modules to deploy (directory names under apps/, space-separated)
# site is one Worker that serves every module's public/ (apps/site/README.md); api is the sign-reading Worker,
# to which site forwards /api/* (other than /api/sumo/*) through a service binding
# api must come before site: the bound target Worker has to exist first (apps/site/tests/config.test.mjs checks this)
DEPLOY_MODULES=api site
