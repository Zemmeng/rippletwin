# check.yml -- CI runs the same scripts/check.sh as the local hooks
#
# Purpose: anyone who skips the local hooks (--no-verify) still goes through the same checks.
#       PRs and main both get the full check: [1] scans every tracked file and [5] runs every apps/*/test.sh;
#       only [3] Branch & module boundary is judged on the changes against origin/main (--base origin/main is
#       already the default and is spelled out only for clarity).
#       A second step runs check.sh --selftest, which proves in throwaway repos that each gate still turns red
#       when it should.
#       On failure the "======== Summary" block is written to the job summary (visible on the PR's Checks tab).
# Triggers: pull_request (opened / synchronize / reopened / labeled); push to main.
# Intentional cross-module change: add the cross-module label to the PR → this job reruns with ALLOW_CROSS=1.
# 🔒 Uses no secrets; the only permission is contents: read. The job is named check.
# Reproduce locally: bash scripts/check.sh --base origin/main && bash scripts/check.sh --selftest

name: check

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]

permissions:
  contents: read

# Keep only the latest run per branch (a new push cancels the run still in progress)
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # On a PR, HEAD is a detached merge commit, so check.sh [3] learns the branch name from here; on push it is main
      BRANCH: ${{ github.head_ref || github.ref_name }}
      ALLOW_CROSS: ${{ contains(github.event.pull_request.labels.*.name, 'cross-module') && '1' || '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # check [3] computes a merge-base, which needs the full history and origin/main

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*

      - uses: actions/setup-python@v6
        with:
          python-version: "3.9" # matches macOS's bundled python3, so no 3.10+ syntax slips in

      - name: Run the full check (bash scripts/check.sh --base origin/main)
        id: check
        run: bash scripts/check.sh --base origin/main

      - name: Self-test the gates (bash scripts/check.sh --selftest)
        id: selftest
        if: ${{ !cancelled() }}
        run: bash scripts/check.sh --selftest

      - name: Write the summary to the job summary
        if: failure()
        env:
          CHECK_OUTCOME: ${{ steps.check.outcome }}
          SELFTEST_OUTCOME: ${{ steps.selftest.outcome }}
        run: |
          {
            if [ "$CHECK_OUTCOME" = failure ]; then
              echo "## ❌ check.sh failed"
              echo
              if [ -f logs/last-check.txt ] && grep -q '^======== Summary' logs/last-check.txt; then
                echo '```'
                sed -n '/^======== Summary/,$p' logs/last-check.txt
                echo '```'
              else
                echo "logs/last-check.txt has no summary block (check.sh may have crashed); see the step log above."
              fi
              echo
              echo "Reproduce locally: \`bash scripts/check.sh --base origin/main\`"
              echo "If the cross-module change is intentional, add the \`cross-module\` label to the PR and the check reruns."
              echo
            fi
            if [ "$SELFTEST_OUTCOME" = failure ]; then
              echo "## ❌ check.sh --selftest failed"
              echo
              echo "At least one gate no longer turns red (or green) when it should; see the step log above."
              echo "Reproduce locally: \`bash scripts/check.sh --selftest\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
