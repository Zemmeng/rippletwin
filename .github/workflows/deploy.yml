# deploy.yml -- manually triggered Cloudflare deploy (a backup channel for deploying from the GitHub web UI)
#
# 🔒 Manual trigger only (workflow_dispatch); never deploys automatically on a push or PR.
# 🔒 Only the DEPLOYER may run it: DEPLOYER in hackathon.conf is compared with github.actor (case-insensitive);
#    any mismatch is refused.
# 🔒 Usable only after CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID have been added under the repository's
#    Settings → Secrets and variables → Actions. See docs/architecture/deployment.md.
# How to use: Actions → deploy → Run workflow, and fill in module:
#       <module>  deploys apps/<module>
#       all       deploys DEPLOY_MODULES from hackathon.conf one after another (one at a time, never in parallel)
# Before deploying, the plan job checks in order: secrets present → actor is DEPLOYER → freeze rule →
#       a full bash scripts/check.sh run has no ❌.
# Freeze rule: when PHASE from bash scripts/check.sh --time-raw is "code freeze" or "deadline passed", deploy only
#       from a demo-* tag (pick it under "Use workflow from"); to hotfix from a branch, tick hotfix (and record the
#       reason in docs/decisions.md). The deadline has passed, so a deploy from main needs hotfix.
# Each module is deployed with its own `npm run deploy` -- the same command scripts/deploy.sh runs -- so build steps
#       such as apps/site's node build.mjs are included.
# After deploying, it runs bash scripts/check.sh --e2e against DEMO_URL from hackathon.conf (skipped if empty).
# The preferred way to deploy is bash scripts/deploy.sh locally (same preflight checks); this is the fallback
# when no local environment is available.

name: deploy

on:
  workflow_dispatch:
    inputs:
      module:
        description: "Module name under apps/; all = deploy DEPLOY_MODULES from hackathon.conf one by one"
        required: true
        default: all
        type: string
      hotfix:
        description: "Deploy from a ref other than a demo-* tag during the code freeze or after the deadline (hotfix). Record the reason in docs/decisions.md"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

# Queue deploys and never cancel one (a half-finished deploy is worse than a slow one)
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      modules: ${{ steps.plan.outputs.modules }}
    env:
      BRANCH: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # check.sh [3] computes a merge-base

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*

      - uses: actions/setup-python@v6
        with:
          python-version: "3.9"

      - name: Preflight checks and module list
        id: plan
        env:
          MODULE: ${{ inputs.module }}
          ACTOR: ${{ github.actor }}
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          set -uo pipefail
          conf() { grep -E "^$1=" hackathon.conf | cut -d= -f2- | sed 's/#.*//' | xargs; }

          if [ "$HAS_TOKEN" != "true" ] || [ "$HAS_ACCOUNT" != "true" ]; then
            echo "::error::Missing GitHub secrets: CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID. Add them as described in docs/architecture/deployment.md, then run again."
            exit 1
          fi

          deployer=$(conf DEPLOYER)
          lower() { printf '%s' "$1" | tr '[:upper:]' '[:lower:]'; }
          if [ -z "$deployer" ] || [ "$(lower "$ACTOR")" != "$(lower "$deployer")" ]; then
            echo "::error::Only the DEPLOYER (${deployer:-not set} in hackathon.conf) can deploy; this run was started by $ACTOR."
            exit 1
          fi

          if [ "$MODULE" = "all" ]; then
            mods=$(conf DEPLOY_MODULES)
            if [ -z "$mods" ]; then
              echo "::error::DEPLOY_MODULES in hackathon.conf is empty: list the apps/ modules to deploy there (space-separated)."
              exit 1
            fi
          else
            mods=$MODULE
          fi

          json=""
          for m in $mods; do
            case "$m" in
              ""|.*|*[!A-Za-z0-9._-]*)
                echo "::error::Invalid module name: $m (only letters, digits, . _ - are allowed)"; exit 1 ;;
            esac
            if [ ! -d "apps/$m" ]; then
              echo "::error::apps/$m does not exist"; exit 1
            fi
            if [ ! -f "apps/$m/wrangler.jsonc" ] && [ ! -f "apps/$m/wrangler.json" ] && [ ! -f "apps/$m/wrangler.toml" ]; then
              echo "::error::apps/$m has no wrangler config, so it is not a Cloudflare module (nothing to deploy)"; exit 1
            fi
            json="$json${json:+,}\"$m\""
          done
          echo "modules=[$json]" >> "$GITHUB_OUTPUT"
          echo "Will deploy: $mods"

      - name: Freeze rule
        env:
          REF: ${{ github.ref }}
          HOTFIX: ${{ inputs.hotfix }}
        run: |
          phase=$(bash scripts/check.sh --time-raw | grep -E '^PHASE=' | head -n 1 | cut -d= -f2-)
          echo "Phase: ${phase:-(unreadable)} · ref: $REF · hotfix: $HOTFIX"
          case "$phase" in
            *"code freeze"*|*"deadline passed"*)
              case "$REF" in
                refs/tags/demo-*) echo "Freeze rule: deploying from $REF is allowed" ;;
                *)
                  if [ "$HOTFIX" = "true" ]; then
                    echo "::warning::Hotfix deploy from $REF during the freeze (hotfix ticked): record the reason in docs/decisions.md."
                  else
                    echo "::error::Phase is \"$phase\": deploy only from a demo-* tag (pick the tag under \"Use workflow from\" when you run the workflow), or tick hotfix for an urgent fix."
                    exit 1
                  fi ;;
              esac ;;
          esac

      - name: Full check (bash scripts/check.sh; no deploy on any ❌)
        run: bash scripts/check.sh

      - name: Write the summary to the job summary
        if: failure()
        run: |
          if [ -f logs/last-check.txt ] && grep -q '^======== Summary' logs/last-check.txt; then
            { echo "## ❌ Pre-deploy check failed"; echo '```'; sed -n '/^======== Summary/,$p' logs/last-check.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy:
    name: deploy ${{ matrix.module }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        module: ${{ fromJSON(needs.plan.outputs.modules) }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*

      # Install the module's own dependencies first: wrangler is a devDependency of every Worker module, so the
      # deploy below uses the version pinned in package-lock.json (without a lockfile, the newest version allowed
      # by package.json at the time).
      - name: Install dependencies
        working-directory: apps/${{ matrix.module }}
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          elif [ -f package.json ]; then
            npm install --no-package-lock --no-audit --no-fund
          fi

      # Same command as scripts/deploy.sh: the module's own deploy script, which also runs any build step it needs
      # (apps/site: node build.mjs && wrangler deploy; its out/ directory is gitignored, so a bare wrangler deploy
      # would have no assets). Modules without a deploy script fall back to a plain wrangler deploy.
      - name: Deploy (npm run deploy)
        working-directory: apps/${{ matrix.module }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -f package.json ] && node -e 'process.exit((require("./package.json").scripts || {}).deploy ? 0 : 1)'; then
            npm run deploy
          else
            npx --yes wrangler deploy
          fi

      - name: Write the deploy record to the job summary
        env:
          MODULE: ${{ matrix.module }}
          REF: ${{ github.ref_name }}
        run: |
          echo "- ✅ \`$MODULE\` · $REF@${GITHUB_SHA:0:7} · $(date -u '+%Y-%m-%d %H:%M UTC') · URL: see the deploy step log" >> "$GITHUB_STEP_SUMMARY"

  smoke:
    name: e2e smoke
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: bash scripts/check.sh --e2e DEMO_URL
        run: |
          url=$(grep -E '^DEMO_URL=' hackathon.conf | cut -d= -f2- | sed 's/#.*//' | xargs)
          if [ -z "$url" ]; then
            echo "::warning::DEMO_URL in hackathon.conf is empty, skipping the live smoke test."
            exit 0
          fi
          bash scripts/check.sh --e2e "$url"
