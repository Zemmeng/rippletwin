name: Feature request
description: Suggest an improvement or a new capability.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        RippleTwin was built at a hackathon (29 Sep – 1 Oct 2026) and is maintained on a best-effort basis, so not every request can be taken on.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What you would like to happen. Mention the module(s) it would touch if you know them.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you have tried.
