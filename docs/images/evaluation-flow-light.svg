<g class="node"><rect x="354.5" y="512" width="262" height="320" rx="10" fill="#f4f4f5" stroke="#8c959f" stroke-width="1.5"/><text x="370.5" y="542" font-size="11" fill="#59636e" font-weight="700" letter-spacing="1">OUTPUT</text><text x="370.5" y="564" font-size="16" fill="#1f2328" font-weight="600">Export one-page pack</text><text x="370.5" y="616" font-size="14" fill="#59636e">Chosen plan and the reason</text><text x="370.5" y="642" font-size="14" fill="#59636e">Hire quote and stock check</text><text x="370.5" y="668" font-size="14" fill="#59636e">VMS schedule, set-up checks,</text><text x="370.5" y="688" font-size="14" fill="#59636e">who to notify</text></g>
<g class="node"><rect x="40" y="512" width="262" height="320" rx="10" fill="#fef6ef"/><rect x="40" y="512" width="5" height="320" rx="2.5" fill="#F07D1A"/><text x="62" y="552" font-size="19" fill="#1f2328" font-weight="700">AI interprets —</text><text x="62" y="577" font-size="19" fill="#1f2328" font-weight="700">the engine calculates</text><text x="62" y="612" font-size="14" fill="#59636e">The LLM only says how each</text><text x="62" y="632" font-size="14" fill="#59636e">road user reads a sign: noticed,</text><text x="62" y="652" font-size="14" fill="#59636e">understood, trusted, which road.</text><text x="62" y="680" font-size="14" fill="#59636e">Route shares, queues and</text><text x="62" y="700" font-size="14" fill="#59636e">delays are computed by the</text><text x="62" y="720" font-size="14" fill="#59636e">engine, which is deterministic:</text><text x="62" y="740" font-size="14" fill="#59636e">the same plan and readings</text><text x="62" y="760" font-size="14" fill="#59636e">always give the same numbers.</text></g>
