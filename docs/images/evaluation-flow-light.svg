<g class="node"><rect x="983.5" y="512" width="262" height="320" rx="10" fill="#eff1f4" stroke="#5b6f8f" stroke-width="1.5"/><circle cx="1016.5" cy="556" r="17" fill="#465a78"/><text x="1016.5" y="562" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">6</text><text x="1045.5" y="542" font-size="11" fill="#465a78" font-weight="700" letter-spacing="1">SIMULATION</text><text x="1045.5" y="564" font-size="16" fill="#1f2328" font-weight="600">Micro-simulation</text><text x="1045.5" y="584" font-size="16" fill="#1f2328" font-weight="600">cross-check</text><text x="999.5" y="616" font-size="14" fill="#59636e">Eclipse SUMO on the real</text><text x="999.5" y="636" font-size="14" fill="#59636e">network, 08:00–09:00, for the</text><text x="999.5" y="656" font-size="14" fill="#59636e">covered plan</text><text x="999.5" y="682" font-size="14" fill="#59636e">Input: the engine's detour share p</text><text x="999.5" y="708" font-size="14" fill="#59636e">A cross-check, not proof: signal</text><text x="999.5" y="728" font-size="14" fill="#59636e">timing and turn shares are</text><text x="999.5" y="748" font-size="14" fill="#59636e">assumed</text><g class="node"><rect x="999.5" y="772" width="230" height="44" rx="7" fill="#e1e4e8" stroke="#8c959f" stroke-width="1"/><text x="1011.5" y="790" font-size="12" fill="#1f2328">Since the event: pre-computed</text><text x="1011.5" y="806" font-size="12" fill="#1f2328">replay, seed 42</text></g></g>
