<text x="40" y="62" font-size="28" fill="#e6edf3" font-weight="700">How a works plan is evaluated</text>
<text x="40" y="94" font-size="15" fill="#9da7b3">From a works plan to a one-page execution pack, on Melbourne's real CBD road network. The AI only reads signs; the numbers come from the deterministic engine and SUMO.</text>
<text x="1271.8" y="464" font-size="13" fill="#9da7b3" text-anchor="middle">queue feedback</text>
<text x="485.5" y="468" font-size="13" fill="#9da7b3" text-anchor="middle">each kit and advisor fix is re-run through steps 1–5</text>
<text x="72" y="879" font-size="14" fill="#e6edf3">AI (LLM, keyword-rule fallback)</text>
<text x="356.2" y="879" font-size="14" fill="#e6edf3">Deterministic engine</text>
<text x="567.7" y="879" font-size="14" fill="#e6edf3">Micro-simulation (SUMO)</text>
<text x="812.5" y="879" font-size="14" fill="#e6edf3">Input, output and post-event notes</text>
<text x="1118.3" y="879" font-size="14" fill="#e6edf3">Feedback loop</text>
</svg>
