<g class="node"><rect x="669" y="512" width="262" height="320" rx="10" fill="#0f292d" stroke="#17a79e" stroke-width="1.5"/><circle cx="702" cy="556" r="17" fill="#17a79e"/><text x="702" y="562" font-size="16" font-weight="700" fill="#0d1117" text-anchor="middle">7</text><text x="731" y="542" font-size="11" fill="#4fd0c6" font-weight="700" letter-spacing="1">ENGINE + RULES</text><text x="731" y="564" font-size="16" fill="#e6edf3" font-weight="600">Compare plans</text><text x="685" y="616" font-size="14" fill="#9da7b3">A Minimum: no VMS</text><text x="685" y="636" font-size="14" fill="#9da7b3">B Standard: 2 VMS show delay</text><text x="685" y="656" font-size="14" fill="#9da7b3">C Guided: 1 VMS names detour</text><text x="685" y="682" font-size="14" fill="#9da7b3">Kits drawn from limited hire</text><text x="685" y="702" font-size="14" fill="#9da7b3">stock; hire cost assumed</text><text x="685" y="728" font-size="14" fill="#9da7b3">Rule-based advisor suggests up</text><text x="685" y="748" font-size="14" fill="#9da7b3">to three fixes</text><g class="node"><rect x="685" y="772" width="230" height="44" rx="7" fill="#2e352a" stroke="#F07D1A" stroke-width="1"/><text x="697" y="790" font-size="12" fill="#e6edf3">Any AI summary may only quote</text><text x="697" y="806" font-size="12" fill="#e6edf3">engine numbers</text></g></g>
<g class="node"><rect x="354.5" y="512" width="262" height="320" rx="10" fill="#1d2128" stroke="#6e7681" stroke-width="1.5"/><text x="370.5" y="542" font-size="11" fill="#9da7b3" font-weight="700" letter-spacing="1">OUTPUT</text><text x="370.5" y="564" font-size="16" fill="#e6edf3" font-weight="600">Export one-page pack</text><text x="370.5" y="616" font-size="14" fill="#9da7b3">Chosen plan and the reason</text><text x="370.5" y="642" font-size="14" fill="#9da7b3">Hire quote and stock check</text><text x="370.5" y="668" font-size="14" fill="#9da7b3">VMS schedule, set-up checks,</text><text x="370.5" y="688" font-size="14" fill="#9da7b3">who to notify</text></g>
<g class="node"><rect x="40" y="512" width="262" height="320" rx="10" fill="#241c17"/><rect x="40" y="512" width="5" height="320" rx="2.5" fill="#F07D1A"/><text x="62" y="552" font-size="19" fill="#e6edf3" font-weight="700">AI interprets —</text><text x="62" y="577" font-size="19" fill="#e6edf3" font-weight="700">the engine calculates</text><text x="62" y="612" font-size="14" fill="#9da7b3">The LLM only says how each</text><text x="62" y="632" font-size="14" fill="#9da7b3">road user reads a sign: noticed,</text><text x="62" y="652" font-size="14" fill="#9da7b3">understood, trusted, which road.</text><text x="62" y="680" font-size="14" fill="#9da7b3">Route shares, queues and</text><text x="62" y="700" font-size="14" fill="#9da7b3">delays are computed by the</text><text x="62" y="720" font-size="14" fill="#9da7b3">engine, which is deterministic:</text><text x="62" y="740" font-size="14" fill="#9da7b3">the same plan and readings</text><text x="62" y="760" font-size="14" fill="#9da7b3">always give the same numbers.</text></g>
