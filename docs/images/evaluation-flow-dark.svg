<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="912" viewBox="0 0 1600 912" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, &apos;Segoe UI&apos;, Helvetica, Arial, sans-serif">
<title id="title">How a works plan is evaluated</title>
<desc id="desc">Pipeline from a works plan to a one-page execution pack. Input: closed lanes and footpaths, dates and hours, signs and VMS text. Step 1, engine: affected traffic and up to three named detours on the real 1,513-link CBD network. Step 2, AI: each persona (commuter, local, tourist, delivery) reads the signs, by LLM or keyword rules, cached. Step 3, engine: two-group logit route choice calibrated at two points, 3% for a warning-only sign and 20% for a sign naming the detour. Step 4, engine: assignment with BPR link times and D/D/1 queues over 6 MSA iterations that feed queues back into route choice. Step 5, engine: impacts on queues, delay per vehicle, vehicle-minutes, tram and bus riders, pedestrians and clashes with nearby works. Step 6, simulation: Eclipse SUMO cross-check on the real network using the engine's detour share. Step 7: compare plans A Minimum, B Standard and C Guided, built from limited hire stock with assumed hire cost, plus a rule-based advisor; each kit and fix is re-run through steps 1 to 5. Output: a one-page pack. The AI interprets signs; the engine calculates.</desc>
