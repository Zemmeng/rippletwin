<g class="node"><rect x="983.5" y="140" width="262" height="276" rx="10" fill="#0f292d" stroke="#17a79e" stroke-width="1.5"/><circle cx="1016.5" cy="184" r="17" fill="#17a79e"/><text x="1016.5" y="190" font-size="16" font-weight="700" fill="#0d1117" text-anchor="middle">3</text><text x="1045.5" y="170" font-size="11" fill="#4fd0c6" font-weight="700" letter-spacing="1">ENGINE</text><text x="1045.5" y="192" font-size="16" fill="#e6edf3" font-weight="600">Route choice</text><text x="999.5" y="244" font-size="14" fill="#9da7b3">Two-group logit: informed and</text><text x="999.5" y="264" font-size="14" fill="#9da7b3">uninformed drivers</text><text x="999.5" y="290" font-size="14" fill="#9da7b3">Two-point calibration: a</text><text x="999.5" y="310" font-size="14" fill="#9da7b3">warning-only sign diverts 3%, a</text><text x="999.5" y="330" font-size="14" fill="#9da7b3">sign naming the detour 20%</text></g>
