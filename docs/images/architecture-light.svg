<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1335" viewBox="0 0 1600 1335" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, &apos;Segoe UI&apos;, Helvetica, Arial, sans-serif">
<title id="title">RippleTwin system architecture</title>
<desc id="desc">Four browser modules (web app, traffic engine, sign reader and SUMO replay player) send every request over same-origin HTTPS to one Cloudflare Worker, hackathon-site. It serves each module's public files as static assets, sends /api/* through a service binding to the hackathon-api Worker (KV cache READINGS, Durable Objects LlmBudget and WorksiteRegister) and sends /api/sumo/* to the hackathon-sumo Worker and its Cloudflare Container running Eclipse SUMO 1.27.1. The SUMO service was retired after the event and baked replays are served instead. The API Worker called the DeepSeek API until its key was removed after the event; sign reading now falls back to keyword rules. An offline Python pipeline (apps/roads) turns open data into static JSON, which is deployed with the pre-computed SUMO replays and 92 pre-computed LLM sign readings.</desc>
