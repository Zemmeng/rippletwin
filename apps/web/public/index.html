/* ---------- roads over buildings ---------- */
function roadPieces(Wd){
  const out=[],span=Wd.real&&typeof STREET_SPAN!=='undefined'?STREET_SPAN:{};
  for(const st of Wd.streets){
    const r=carriage(st),H=st.axis==='h',sp=span[st.id],lim=sp?[sp[0],sp[1]]:[-Infinity,Infinity];
    const runs=H?[[r.x0,r.x1]]:freeSpans(st,0);
    for(const[a0,b0]of runs){const a=Math.max(a0,lim[0]),b=Math.min(b0,lim[1]);if(b<=a)continue;out.push(H?{H,x0:a,x1:b,y0:r.y0,y1:r.y1,st}:{H,x0:r.x0,x1:r.x1,y0:a,y1:b,st});}
  }
  return out;
}
function emphasizeRoads(c,V,Wd,basemap,light){
  const X=x=>V.X(x),Y=y=>V.Y(y),s=V.s,vec=basemap==='streets';
  c.save();
  /* 1. wash roofs back toward the ground tone */
  c.fillStyle=vec?(light?'rgba(240,243,242,.62)':'rgba(13,18,21,.52)'):(light?'rgba(20,24,28,.34)':'rgba(6,8,10,.5)');
  c.beginPath();
  for(const b of Wd.buildings){
    if(X(b.x1)<-20||X(b.x0)>V.w+20||Y(b.y0)<-20||Y(b.y1)>V.h+20)continue;
    const P=b.pts?(polyArea(b.pts)>0?b.pts:b.pts.slice().reverse()):[[b.x0,b.y0],[b.x1,b.y0],[b.x1,b.y1],[b.x0,b.y1]];
    c.moveTo(X(P[0][0]),Y(P[0][1]));for(let i=1;i<P.length;i++)c.lineTo(X(P[i][0]),Y(P[i][1]));c.closePath();
  }
  c.fill('nonzero');
  /* a landmark already inside a washed footprint (real data) would go twice as dark */
  for(const l of Wd.landmarks||[]){if(Wd.buildings.some(b=>l.x>=b.x0&&l.x<=b.x1&&l.y>=b.y0&&l.y<=b.y1))continue;c.beginPath();c.arc(X(l.x),Y(l.y),l.r*s,0,Math.PI*2);c.fill();}
  /* 2. lift the carriageways out of building shadow, then edge them */
  const pcs=roadPieces(Wd);
  if(!vec){c.globalCompositeOperation='screen';c.fillStyle=light?'rgba(72,80,88,.5)':'rgba(60,68,76,.55)';for(const p of pcs)c.fillRect(X(p.x0),Y(p.y1),(p.x1-p.x0)*s,(p.y1-p.y0)*s);c.globalCompositeOperation='source-over';}
  c.strokeStyle=vec?(light?'rgba(88,104,110,.9)':'rgba(150,172,184,.6)'):'rgba(238,242,246,.66)';c.lineWidth=clamp(s*.32,1,2.2);c.beginPath();
  for(const p of pcs){if(p.H){for(const y of[p.y0,p.y1]){c.moveTo(X(p.x0),Y(y));c.lineTo(X(p.x1),Y(y));}}else{for(const x of[p.x0,p.x1]){c.moveTo(X(x),Y(p.y0));c.lineTo(X(x),Y(p.y1));}}}
  c.stroke();
  c.restore();
}

/* ============================================================
   T21 · Nearby works · clash check (D-0929-2011 ②).
   Step 3, network tab: other works in the register (T5 /api/worksites, seed fallback) that overlap this plan
   in time → be.clash() = D(A+B) − D(A) − D(B) on the real CBD network, and a one-click be.stagger().
   Every number comes from the engine; nothing here calls an LLM. Text from the register goes through esc().
   Hooks (one call each): 5-app.js renderPanel() step 3 → clashMount(); draw loop step 3 → clashDraw().
   ============================================================ */
const CL={m:null,listP:null,src:null,key:'',seq:0,busy:false,err:null,other:null,more:[],st:null,stBusy:false,stErr:null};
const CL_MAX=3; // score at most this many overlapping works; the costliest reliable one is shown
const clDay=s=>Date.UTC(+s.slice(0,4),+s.slice(5,7)-1,+s.slice(8,10))/864e5;
function clashCur(){return planFrom(EP).worksites[0];}
function clashLoad(){
  if(!CL.listP)CL.listP=import('/api/public/js/worksites.js')
    .then(async m=>{CL.m=m;const r=await m.listWorksites();CL.src=r.src;return r.worksites||[];});
  return CL.listP;
}
// Days to push the other works so it starts the day after this plan ends (the button's N; stagger() may stop earlier)
function clashDays(ws){const cur=clashCur();return Math.max(1,Math.min(14,clDay(cur.time.to)-clDay(ws.time.from)+1));}
// Registered works that overlap plan `cur` in time (not the same works), at most CL_MAX, each scored by be.clash(), the
// costliest reliable one first. alive() false = the caller moved on → null. 04 Compare's "Nearby works" row uses the same pick (T43)
async function clashPick(cur,alive){
  const list=await clashLoad();if(!alive())return null;
  const same=o=>o.links.length===cur.links.length&&o.links.every(id=>cur.links.includes(id)); // the same works already in the register
  const cands=CL.m.overlapping(cur,list).filter(o=>!same(o)).slice(0,CL_MAX),scored=[];
  for(const o of cands){const ws=CL.m.toEngineWorksite(o),r=await BE.api.clash(cur,ws);if(!alive())return null;scored.push({o,ws,r});}
  return scored.sort((x,y)=>(y.r.flags.reliable-x.r.flags.reliable)||(y.r.cost-x.r.cost)||(x.o.id<y.o.id?-1:1));
}
async function clashRun(){
  const seq=++CL.seq;Object.assign(CL,{busy:true,err:null,other:null,more:[],st:null,stBusy:false,stErr:null});clashRender();
  try{const scored=await clashPick(clashCur(),()=>seq===CL.seq);if(!scored)return;CL.other=scored[0]||null;CL.more=scored.slice(1);}
  catch(e){if(seq!==CL.seq)return;CL.err=e;console.warn('clash check failed',e);}
  CL.busy=false;clashRender();
}
async function clashStagger(){
  const x=CL.other,seq=CL.seq;if(!x||CL.stBusy)return;
  CL.stBusy=true;CL.stErr=null;clashRender();
  try{const st=await BE.api.stagger(clashCur(),x.ws,{maxDays:clashDays(x.ws)});if(seq!==CL.seq)return;CL.st=st;}
  catch(e){if(seq!==CL.seq)return;CL.stErr=e;console.warn('stagger failed',e);}

}

  const{o,ws,r}=CL.other,net=engNet(),l0=net&&net.links.get(ws.links[0]),street=esc(shortSt(l0&&l0.name||'')),title=esc(o.title);

async function cmpUpdate(){
  if(!engOn()||EP.badText)return;
  const plan=planFrom(EP),kits=typeof BE.api.options==='function';
  if(!kits&&!EP.adv)return; // fallback path waits for the advisor
  const key=JSON.stringify(plan)+(kits?'|kits':'|adv|'+JSON.stringify(EP.adv.options.map(o=>o.plan)));
  if(key===CP.key)return;
  CP.key=key;CP.rows=[];CP.pick=null;CP.busy=true;const seq=++CP.seq;
  let rows=null,src='';
  if(kits){try{rows=cmpFromOptions(await cmpOptions(plan));src='kits';}catch(e){console.warn('compare: options() failed, using the advisor instead',e);}}
  if(!rows||!rows.length){
    if(!EP.adv){if(seq===CP.seq){CP.key='';CP.busy=false;}return;} // retried when the advisor lands (engRender4 → cmpRender)
    rows=[];src='advisor';
    for(const x of cmpSources(plan,EP.adv)){let s=null;try{s=await BE.api.run(x.plan);}catch(e){console.warn('compare: run failed',e);}rows.push({...x,s});}
  }

    const ws=r.plan.worksites[0];r.hire=null;r.days=null;

}

// 04 Compare, "Nearby works" row (T43): each plan against the one overlapping works 03 Impact shows for this plan (same pick,
// clashPick in 8-clash.js), by be.clash(). Filled in after the table is on screen, cell by cell; never holds the table up.
// CP.cl = { key, other: undefined (still picking) | null (none overlap) | { o, ws, r, days? }, cells: [clash result | 'err'], err }
// T46: 03 staggered the other works → other.ws is 03's shifted works and other.days its N (cmpClashOther); the key carries N,
// so staggering in 03 re-scores this row, and 03 dropping the stagger (re-scored, CL.st = null) puts the original dates back
async function cmpClashUpdate(){
  if(S.ui!==4||CP.busy||CP.rows.length<2||!engOn()||EP.badText)return;
  const cur=clashCur(),in3=CL.m&&CL.key===JSON.stringify(cur)&&!CL.busy&&!CL.err; // 03 already picked it for this same plan
  const x3=in3?cmpClashOther(CL.other,CL.st):null,key=CP.key+(x3&&x3.days!=null?`|+${x3.days}`:'');
  if(CP.cl&&CP.cl.key===key)return;

  try{
    let x;
    if(in3)x=x3; // 03's pick, shifted if 03 staggered it
    else{const sc=await clashPick(cur,alive);if(!sc)return;x=sc[0]||null;}
    st.other=x;cmpRender();
    for(let i=0;x&&!suPlan()&&i<CP.rows.length;i++){ // T49: the SUMO plan shows no engine clash cost → not scored per plan
      const r=CP.rows[i];let v='err';
      if(r.s)try{v=await BE.api.clash(r.plan.worksites[0],x.ws);}catch(e){console.warn('compare: clash check failed for plan',r.id,e);}
      if(!alive())return;st.cells[i]=v;cmpRender();
    }
  }catch(e){if(!alive())return;st.err=true;console.warn('compare: nearby works check failed',e);cmpRender();}
}

// Independent of scoring: never delay choosing/exporting a plan for AI text.
function cmpExplainUpdate(){

  // T49: on the SUMO plan the AI explanation is not asked for — explain.js reads the engine's numbers (optionFromRun) and would

// ---- SUMO plan (D-1001-0045): 04 / 05 traffic numbers come from SUMO ----
// Each option's p (cmpP: the engine's sign reading, behind the scenes) → the SUMO client's runOptions([{ id, p }…], { seed })
// (sumo-client.js, T49-a; loaded by 5-app.js sumoClient(), feature-detected). Missing, failing or empty → '—' + the reason,
// never engine numbers. CP.su = { key, busy, t0, job, res: { id: metrics | null } | null, err, src: { source, elapsedMs, why (the client's reason, labelled), seed, hour }, tick }
// T50: runs go through CSU (below), shared with the prefetch that starts right after step 2's live run — 04 joins it
const CSU=new Map(),CSU_MAX=8;
// T50: the SUMO options run for ask + seed, one per cmpSuKey: started once, joined by whoever asks next (04, the step-2
// prefetch, a second visit). job = { key, t0 (asked), wait (queued in sumoLane behind another cloud run — never two at once
// from this page), t1 (its cloud call began), p: Promise<out>, out: { r } | { fail: 'load' | 'fn' | 'run', why } once settled }.
// Only a run that gave results stays cached (the newest CSU_MAX); a failure is dropped, so "Try again" really runs again
function cmpSuJob(ask,seed){
  const key=cmpSuKey(ask,seed),hit=CSU.get(key);if(hit)return hit;
  const job={key,t0:Date.now(),t1:0,wait:false,out:null,p:null};CSU.set(key,job);
  while(CSU.size>CSU_MAX)CSU.delete(CSU.keys().next().value);
  const why=e=>typeof sumoErr==='function'?sumoErr(e):String((e&&e.message)||e).slice(0,160); // plain text: esc() when shown (cmpSuRows)
  const ping=()=>{if(CP.su&&CP.su.job===job&&typeof cmpRender==='function')cmpRender();}; // queued → computing: the spinner's words change
  job.p=(async()=>{
    let fn=null;
    try{const cli=typeof sumoClient==='function'?await sumoClient():null,mod=typeof SU==='object'&&SU?SU.mod:null;
      fn=cli&&typeof cli.runOptions==='function'?cli.runOptions.bind(cli):mod&&typeof mod.runOptions==='function'?mod.runOptions:null;}
    catch(e){return{fail:'load',why:why(e)};}
    if(!fn)return{fail:'fn'};
    const go=()=>{job.wait=false;job.t1=Date.now();ping();return fn(ask,{seed});};
    try{if(typeof sumoLane!=='function')return{r:await go()};job.wait=true;const run=sumoLane(go);ping();return{r:await run};} // lane free → go() runs before the next paint
    catch(e){job.wait=false;return{fail:'run',why:why(e)};}
  })().then(out=>{job.out=out;if(!(out.r&&Object.values(cmpSuParse(out.r,ask.map(o=>o.id))).some(Boolean))&&CSU.get(key)===job)CSU.delete(key);return out;});
  return job;
}
// T50: right after step 2's live SUMO run (sumoRerun in 5-app.js, seed = that run's), build 04's plans exactly as 04 does
// (cmpOptions → cmpFromOptions → cmpP) and start their options run in the background; nothing is rendered. 04 then finds it
// in CSU: finished → shown at once, still running → joined. Off the SUMO plan / no options() / plan or seed changed while the
// plans were built → nothing. → the job, or null
async function cmpPrefetch(seed){
  try{
    if(!suPlan()||!engOn()||EP.badText||!BE.api||typeof BE.api.options!=='function')return null;
    const plan=planFrom(EP),key=JSON.stringify(plan),sd=Number.isFinite(seed)?seed:typeof SU==='object'&&SU?SU.seed:42;
    const rows=cmpFromOptions(await cmpOptions(plan));
    if(!suPlan()||JSON.stringify(planFrom(EP))!==key||(typeof SU==='object'&&SU&&SU.seed!==sd)||rows.length<2)return null;
    const ask=cmpSuAsk(rows);
    return ask.length?cmpSuJob(ask,sd):null;
  }catch(e){console.info('04 prefetch skipped:',(e&&e.message)||e);return null;}
}

function cmpSuEl(su){const j=su&&su.job,t=j?(j.t1||j.t0):su&&su.t0;return Math.max(0,Math.round((Date.now()-(t||Date.now()))/1000));}
async function cmpSuUpdate(){
  if(!suPlan()||(S.ui!==4&&S.ui!==5)||CP.busy||CP.rows.length<2||!engOn()||EP.badText)return;
  const ps=CP.rows.map(r=>cmpP(r.s)),seed=typeof SU==='object'&&SU?SU.seed:42,key=`${CP.key}|${ps.join(',')}|${seed}`;
  if(CP.su&&CP.su.key===key)return;
  if(CP.su&&CP.su.tick)clearInterval(CP.su.tick);
  const st=CP.su={key,busy:true,t0:Date.now(),job:null,res:null,err:null,src:null,tick:0},alive=()=>CP.su===st;
  const ask=cmpSuAsk(CP.rows);
  const done=err=>{if(!alive())return;st.busy=false;if(err)st.err=err;clearInterval(st.tick);st.tick=0;cmpRender();};
  if(!ask.length)return done(L('the engine read no sign for these plans, so SUMO has no input','引擎没读出这几套方案的牌，SUMO 没有输入'));
  const fin=out=>{
    if(!alive())return;
    if(out.fail==='load')return done(L(`the SUMO client did not load (${out.why})`,`SUMO 客户端没加载上（${out.why}）`));
    if(out.fail==='fn')return done(L('this SUMO client has no runOptions yet — the options run is not deployed','这个版本的 SUMO 客户端还没有 runOptions —— 多方案计算还没上线'));
    if(out.fail)return done(L(`the SUMO options run failed (${out.why})`,`SUMO 多方案计算失败（${out.why}）`));
    const r=out.r,res=cmpSuParse(r,ask.map(o=>o.id)),ix=r&&r.index&&typeof r.index==='object'?r.index:{},rs=r&&r.reason?String(typeof sumoReason==='function'?sumoReason(r.reason):r.reason):'';
    st.src={source:r&&r.source||'',elapsedMs:r&&r.elapsedMs,why:rs,seed:Number.isFinite(+ix.seed)?+ix.seed:seed,hour:Number.isFinite(+ix.hour)?+ix.hour:null};
    if(!Object.values(res).some(Boolean))return done(rs?L(`SUMO gave no result for these plans (${rs})`,`SUMO 没给出这几套方案的结果（${rs}）`):L('SUMO gave no result for these plans','SUMO 没给出这几套方案的结果'));
    st.res=res;done(null);
  };
  // T50: the run the step-2 prefetch (or an earlier visit) started is joined — finished: shown at once, no spinner;
  // still running: the spinner goes on from its elapsed time; waiting behind step 2's run: says so
  const job=st.job=cmpSuJob(ask,seed);

  cmpRender();
  fin(await job.p);
}

// Chosen plan → pack.js execution pack → a print / copy sheet. Every string goes in with textContent.
function cmpExport(){
  const r=CP.rows[CP.pick];if(!r||!r.s||!CP.mod||!CP.inv)return;
  const ws=r.plan.worksites[0],lang=LANG.cur==='zh'?'zh':'en';let txt='',doc='';
  try{
    const impacts=CP.mod.ex.optionFromRun(r.id,'plan',r.s).metrics,su=suPlan();
    const p=CP.mod.pack.buildPack({...ws,title:ws.name,status:'decided',decision:{option:r.id,by:CP.by,reason:CP.reason.trim(),at:new Date().toISOString()}},{inventory:CP.inv,links:cmpLinks(ws),impacts});
    // T49: the SUMO plan's pack names who to notify (the engine still decides that behind the scenes) without the engine's numbers
    if(su){p.impacts=null;for(const n of p.notify||[])if(n&&n.why)for(const k of ['pax_min','blocked_pax_h','blocked_vph','peds_extra_min'])if(k in n.why)n.why[k]=null;}
    txt=CP.mod.pack.packText(p,lang)+`\n\n${L('Data sources','数据来源')}\n`+creditLines().map(s=>'- '+s).join('\n');
    if(typeof CP.mod.pack.packDoc==='function'){ // older pack.js (before packDoc) → plain text below
      const sn=su?cmpSuAll():null,rows=CP.rows.map((x,i)=>({id:x.id,label:cmpLabel(x),...(su?{car:sn[i]?sn[i].tot:null,transit:null,peds:null}:cmpNumbers(x.s)),hire:x.hire}));
      const d=CP.mod.pack.packDoc(p,lang);
      if(su){ // T49: the text pack gets the same SUMO footer; a notify line whose reason was only the engine's number says so
        if(d.foot)txt=txt.split(d.foot).join(cmpSuFoot(L));
        for(const n of d.notify||[])if(n&&!n.why)n.why=L('affected — impact not covered by SUMO','受影响 —— 影响 SUMO 暂不覆盖');}
      doc=cmpDocHTML(d,{rows,src:su?'sumo':'engine',pick:CP.pick,by:CP.by==='council'?L('Council','市政'):L('Contractor','施工方'),hour:engHour(su?cmpSuHour():EP.hour),date:new Date().toLocaleString(lang==='zh'?'zh-CN':'en-AU',{dateStyle:'medium',timeStyle:'short'}),credits:creditLines()},{L,esc,fmt:fmtN});
    }
  }catch(e){console.warn('export failed',e);toast(L('Could not build the pack','执行包生成失败'));return;}
  let sh=document.getElementById('cmpSheet');
  if(!sh){sh=document.createElement('div');sh.id='cmpSheet';sh.className='cmp-sheet';sh.setAttribute('role','dialog');sh.setAttribute('aria-modal','true');document.body.appendChild(sh);}
  sh.innerHTML=`<div class="cmp-doc"><div class="between no-print cmp-bar"><b>${L('Execution pack','执行包')}</b><span class="cmp-acts"><button type="button" class="btn ghost" id="cmpCopy">${L('Copy text','复制文字')}</button><button type="button" class="btn" id="cmpPrint">${L('Print / save PDF','打印 / 存 PDF')}</button><button type="button" class="btn ghost" id="cmpClose">${L('Close','关闭')}</button></span></div><div id="cmpPaper"></div></div>`;
  const paper=document.getElementById('cmpPaper');
  if(doc)paper.innerHTML=doc; // cmpDocHTML esc()s every string it is given
  else{const pre=document.createElement('pre');pre.id='cmpText';pre.textContent=txt;paper.appendChild(pre);}
  const close=()=>{sh.hidden=true;document.removeEventListener('keydown',esc1);};
  const esc1=e=>{if(e.key==='Escape')close();};
  document.addEventListener('keydown',esc1);
  document.getElementById('cmpClose').onclick=close;
  sh.onclick=e=>{if(e.target===sh)close();};
  document.getElementById('cmpPrint').onclick=()=>window.print();
  document.getElementById('cmpCopy').onclick=()=>{const done=()=>toast(L('Pack copied','已复制执行包'));try{navigator.clipboard.writeText(txt).then(done,()=>toast(L('Copy failed — select the text and copy it','复制失败 —— 请手动选中复制')));}catch(e){toast(L('Copy failed — select the text and copy it','复制失败 —— 请手动选中复制'));}};
  sh.hidden=false;document.getElementById('cmpClose').focus();
}

/* ============================================================
   AI panel (lead · D-0929-2307): show what the LLM actually did.
   Step 3 · "AI road users · what each one read": for the main approach of the latest run, each of the 4 personas'
   sign reading from T5 (readSigns: answer file → /api/read (KV cache / live LLM) → keyword rules): the signs they saw
   in order, noticed / understood / trusts with the reader's range, the route advice, the one-sentence why, and where
   the reading came from. Below it the AI call log: every readSigns call this session (backend.js aiLog(), oldest
   first), downloadable as JSON built in the browser (nothing is uploaded).
   The LLM only interprets (D-0929-1435): every number here comes from the engine or from the reading itself.

/* pure:begin — tests/ai_glue.mjs runs this block in node */
const AI_LOG_KEEP=200; // same bound as backend.js AI_LOG_MAX
const AI_SRC={file:['LLM · precomputed','大模型 · 预先算好'],kv:['LLM · cached','大模型 · 缓存'],llm:['LLM · live','大模型 · 现场'],
  rule:['Rules · fallback','规则 · 兜底'],mixed:['Mixed sources','多种来源'],error:['Not read','没读成'],none:['None this hour','这个小时没有']};
// reading src → friendly label (plain text: esc() it in templates). llm + ms → "LLM · live · 840 ms"
function aiSrcLabel(src,ms){
  const k=AI_SRC[src];if(!k)return src?String(src).slice(0,32):L('Unknown','未知');
  const t=L(k[0],k[1]);

}
function aiSrcTone(src){return src==='file'||src==='kv'||src==='llm'?'ok':src==='error'?'risk':'warn';}
// Where THIS plan's sign readings came from (6-engine.js badge + legend), from readingsOf(s) — not flags.reading_src, which
// is the 8 fixed calibration readings only. All 4 agree → that source; else 'mixed' (green only when every one is an LLM
// source; any rule / missing reading → yellow). rd null → null (caller decides); no persona with signs → 'none'
function aiSrcOf(rd){
  if(!rd||!rd.personas||typeof rd.personas!=='object')return null;
  const ss=Object.values(rd.personas).filter(Boolean).map(p=>p.reading?String(p.src||'error'):'error');
  if(!ss.length)return{src:'none',tone:'',rule:false};
  const llm=ss.every(x=>x==='file'||x==='kv'||x==='llm');
  return{src:ss.every(x=>x===ss[0])?ss[0]:'mixed',tone:llm?'ok':'warn',rule:ss.includes('rule')};
}
// Same rule as engPanel3 (6-engine.js): the panel has current numbers only in 'ok'. Anything else → no persona cards,
// so a failed run never shows the previous plan's readings. ep = EP
function aiState(ep){return!ep?'wait':ep.badText?'bad':ep.runErr&&!ep.busy?'err':!ep.sum?'wait':'ok';}
const AI_EX={llm:['AI explanation · LLM','AI 解读 · 大模型'],kv:['AI explanation · LLM cached','AI 解读 · 大模型缓存'],rule:['AI explanation · rules','AI 解读 · 规则'],api:['AI explanation · API','AI 解读 · 接口']};
function aiExplainLabel(src){const k=AI_EX[src]||AI_EX.api;return L(k[0],k[1]);}
function aiExplainTone(src){return src==='llm'||src==='kv'?'ok':'warn';}
// 0–1 → whole percent, clamped; anything else → null (never lets model text into a style attribute)
function aiPct(x){if(x===null||x===undefined||x==='')return null;const n=Number(x);return Number.isFinite(n)?Math.round(Math.min(1,Math.max(0,n))*100):null;}
// Signs in the order they are passed → [{ kind, text }]; a VMS's frames are joined with ▸
function aiSigns(signs){
  return (Array.isArray(signs)?signs:[]).map(s=>({kind:String(s&&s.kind||''),
    text:s&&Array.isArray(s.frames)?s.frames.map(f=>(Array.isArray(f)?f:[f]).join(' ')).join(' ▸ '):String(s&&s.text||'')}));
}
function aiKind(k){return k==='vms'?'VMS':k==='arrow'?L('Arrow','箭头板'):L('Sign','标志牌');}
const aiSt=n=>String(n).replace(/ Street\b/,' St');
const aiWho=t=>Object.prototype.hasOwnProperty.call(TYPE_L,t)?L(TYPE_L[t][0],TYPE_L[t][1]):String(t==null?'?':t);
// A reading's route advice → one plain-text line: "use Russell St · save 9 min" / "no route advice"
function aiAdvice(r){
  if(!r)return L('no reading','没有读数');
  const a=r.advice&&typeof r.advice==='object'?Object.entries(r.advice).filter(([,v])=>v==='use'||v==='avoid'):[];
  const parts=a.map(([road,v])=>v==='use'?L(`use ${aiSt(road)}`,`走 ${aiSt(road)}`):L(`avoid ${aiSt(road)}`,`别走 ${aiSt(road)}`));
  const sv=r.saving_min==null?NaN:Number(r.saving_min),dl=r.delay_min==null?NaN:Number(r.delay_min);
  if(parts.length&&Number.isFinite(sv)&&sv>0)parts.push(L(`save ${Math.round(sv)} min`,`省 ${Math.round(sv)} 分钟`));
  if(Number.isFinite(dl)&&dl>0)parts.push(L(`${Math.round(dl)} min delay`,`堵 ${Math.round(dl)} 分钟`));
  return parts.length?parts.join(' · '):L('no route advice','没给路线建议');
}
// explain.js label rule: no < >, ≤ 60 characters
function aiLabel(x){return String(x==null?'':x).replace(/[<>]/g,'').slice(0,60)||'plan';}
function aiBar(label,v,rg){
  const p=aiPct(v),lo=Array.isArray(rg)?aiPct(rg[0]):null,hi=Array.isArray(rg)?aiPct(rg[1]):null,has=lo!=null&&hi!=null&&hi>=lo;
  return`<div class="ai-bar"><span class="k">${label}</span><span class="tr">${p==null?'':`<i class="v" style="width:${p}%"></i>`}${has?`<i class="rg" style="left:${lo}%;width:${hi-lo}%"></i>`:''}</span><span class="n">${p==null?'—':p+'%'}${has?`<small>${lo}–${hi}%</small>`:''}</span></div>`;
}
// One persona card. p = backend readingsOf(s).personas[t]; the why goes in later with textContent (data-aiwhy)
function aiPersonaHTML(t,p){
  const nm=esc(aiWho(t));
  if(!p)return`<div class="card ai-p"><div class="ai-ph"><b>${nm}</b><span class="pill">${L('No signs on this road','这段路上没有屏')}</span></div></div>`;
  const r=p.reading,rg=r&&r.range&&typeof r.range==='object'?r.range:{};
  const signs=aiSigns(p.signs).map(s=>`<div class="ai-sign"><span class="kd">${esc(aiKind(s.kind))}</span><span class="tx">${esc(s.text)}</span></div>`).join('');
  return`<div class="card ai-p"><div class="ai-ph"><b>${nm}</b><span class="pill ${aiSrcTone(p.src)}">${esc(aiSrcLabel(p.src,p.ms))}</span></div>
    <div class="ai-signs">${signs}</div>
    ${r?`<div class="ai-bars">${aiBar(L('Noticed','看到'),r.notice,rg.notice)}${aiBar(L('Understood','看懂'),r.understand,rg.understand)}${aiBar(L('Trusts','相信'),r.trust,rg.trust)}</div>
    <div class="ai-adv">→ ${esc(aiAdvice(r))}</div><q class="ai-why" data-aiwhy="${esc(t)}"></q>${p.fallback?`<span class="small muted">${L('Reader error → keyword rules','读屏出错 → 改用关键词规则')}</span>`:''}`
    :`<p class="small muted">${L('No reading for this road user — the engine counts them as not persuaded.','这类人没读成 —— 引擎按没被说动算。')}</p>`}</div>`;
}
// One small tile per road user (2 × 2, same look as the metric tiles): the reading's three numbers and the route advice.
// A button: tap → that persona's full card (aiPersonaHTML) opens under the tiles; sel = it is the one open.
// adv false → no advice line (the panel says once, under the tiles, that none of them got any)
function aiTileHTML(t,p,sel,adv){
  const nm=esc(aiWho(t)),r=p&&p.reading;
  const n=(k,v)=>{const x=aiPct(v);return`<span class="ai-n"><b>${x==null?'—':`${x}<small>%</small>`}</b><em>${k}</em></span>`;};
  const body=!p?`<span class="ai-tnote">${L('No signs on this road','这段路上没有屏')}</span>`
    :!r?`<span class="ai-tnote">${L('Not read · counted as not persuaded','没读成 · 按没被说动算')}</span>`
    :`<span class="ai-ns">${n(L('Seen','看到'),r.notice)}${n(L('Got it','看懂'),r.understand)}${n(L('Trusts','相信'),r.trust)}</span>${adv===false?'':`<span class="ai-tadv">→ ${esc(aiAdvice(r))}</span>`}`;
  const dot=p?`<i class="ai-dot ${aiSrcTone(p.src)}" title="${esc(aiSrcLabel(p.src,p.ms))}"></i>`:'';
  return`<button type="button" class="metric ai-tile${sel?' on':''}" data-aip="${esc(t)}" aria-expanded="${sel?'true':'false'}"${p?'':' disabled'}><span class="ai-th"><span class="eyebrow">${nm}</span>${dot}</span>${body}</button>`;
}
function aiTime(t){const d=new Date(t);return Number.isNaN(d.getTime())?'—':d.toTimeString().slice(0,8);}
// One call-log row (every string through esc())
function aiLogRowHTML(e){

}
// Download: whitelisted fields only (persona, signs, reading) — no headers, keys or anything else a log entry might carry
const AI_READING_KEYS=['notice','understand','advice','saving_min','delay_min','trust','why','range','src','model','prompt_v','note'];
function aiPick(o,keys){const out={};if(!o||typeof o!=='object')return out;for(const k of keys)if(o[k]!==undefined)out[k]=o[k];return out;}
function aiLogJSON(log,meta){
  const entries=(Array.isArray(log)?log:[]).map(e=>({...aiPick(e,['seq','t','persona','kmh','read_s','src','model','ms','fallback','error']),
    roads:Array.isArray(e&&e.roads)?e.roads.map(String):[],

    reading:e&&e.reading?aiPick(e.reading,AI_READING_KEYS):null}));
  return JSON.stringify({app:'RippleTwin',kind:'ai-call-log',...aiPick(meta,['exported_at','lang']),count:entries.length,
    note:'Sign-reading calls only: persona, sign text as seen, the reading and its source. Numbers on the page come from the engine.',entries},null,2);
}

const AI_NO={err:['No readings — the engine could not score this plan.','没有读数 —— 引擎算不了这个方案。'],
  bad:['No readings — fix the sign text in step 1 first.','没有读数 —— 先回第 1 步把屏上文字改合规范。'],

  const none=L('no route advice','没给路线建议'),noAdv=TYPES4.every(t=>!ps[t]||!ps[t].reading||aiAdvice(ps[t].reading)===none); // said once, not four times
  const body=rd?`<div class="ai-tiles" role="group">${TYPES4.map(t=>aiTileHTML(t,ps[t],t===sel,!noAdv)).join('')}</div>${noAdv?`<p class="ai-noadv">→ ${L('None of them was told which way to go','屏上没告诉任何人该走哪条路')}</p>`:''}
    ${sel?`<div class="ai-detail" id="aiDetail">${aiPersonaHTML(sel,ps[sel])}</div>`:''}
    <p class="ai-note">${L(`The LLM only reads the signs · ${typeof sumoPlanOn==='function'&&sumoPlanOn()?'the share who detour is SUMO’s input · SUMO computes the traffic numbers':'the engine computes every number'} · ${sel?'bar = reading, box = range · tap again to close':'tap a tile for details'}`,`大模型只读屏上的字 · ${typeof sumoPlanOn==='function'&&sumoPlanOn()?'绕行比例是 SUMO 的输入 · 交通数字由 SUMO 算':'数字都由引擎算'} · ${sel?'条 = 读数，框 = 区间 · 再点一次收起':'点方块看详情'}`)}</p>`
    :`<p class="small muted">${L('No sign readings for this hour — no works, or no signs on the approach.','这个小时没有读屏 —— 不施工，或这段路上没有屏。')}</p>`;
  return head+body+aiLogHTML();
}
function aiLogHTML(){
  const n=AI.log.length;
  return`<details class="ai-log" id="aiLogBox"${AI.open?' open':''}><summary>${L(`AI call log (${n})`,`AI 调用日志（${n}）`)}</summary>
    <div class="ai-log-bar"><span class="small muted">${L('Every sign-reading call this session, oldest first. Kept in this tab only.','这次打开页面以来的每次读屏调用，按时间排。只留在这个页面里。')}</span><button type="button" class="btn ghost" id="aiDl" ${n?'':'disabled'}>${L('Download JSON','下载 JSON')}</button></div>
    ${n?`<div class="ai-rows">${AI.log.map(aiLogRowHTML).join('')}</div>`:`<p class="small muted ai-none">${L('No calls yet.','还没有调用。')}</p>`}</details>`;
}
function aiRender(){
  const el=document.getElementById('aiBox');if(!el)return;
  const st=aiState(EP),rd=aiReadings(),h=aiHTML(rd,st);
  const whys=rd?TYPES4.map(t=>{const p=rd.personas&&rd.personas[t];return p&&p.reading&&p.reading.why||'';}).join('\u0001'):'';
  const sig=h+'\u0000'+whys;
  if(el.dataset.sig===sig)return; // signature guard: same state → keep the DOM (open log, scroll position, button under the pointer)
  const rows=el.querySelector('.ai-rows'),keepScroll=rows?rows.scrollTop:0;
  el.innerHTML=h;el.dataset.sig=sig;
  el.querySelectorAll('[data-aiwhy]').forEach(q=>{const p=rd&&rd.personas&&rd.personas[q.dataset.aiwhy];q.textContent=p&&p.reading&&p.reading.why||'';});
  const d=el.querySelector('#aiLogBox');if(d)d.addEventListener('toggle',()=>{AI.open=d.open;});
  const nr=el.querySelector('.ai-rows');if(nr)nr.scrollTop=keepScroll;
  const b=el.querySelector('#aiDl');if(b)b.onclick=aiDownload;
  el.querySelectorAll('[data-aip]').forEach(x=>x.onclick=()=>{
    AI.sel=AI.sel===x.dataset.aip?'':x.dataset.aip;aiRender();
    const d=el.querySelector('#aiDetail');if(d)d.scrollIntoView({block:'nearest',behavior:'smooth'}); // bring the opened card into view
  });
}
// JSON built here and handed to the browser as a file: no upload, no network
function aiDownload(){
  try{
    const txt=aiLogJSON(AI.log,{exported_at:new Date().toISOString(),lang:LANG.cur});
    const url=URL.createObjectURL(new Blob([txt],{type:'application/json'}));
    const a=document.createElement('a');a.href=url;a.download=`rippletwin-ai-log-${new Date().toISOString().slice(0,19).replace(/[:T]/g,'-')}.json`;
    document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);
  }catch(e){console.warn('AI log download failed',e);toast(L('Download failed','下载失败'));}
}

</script>
