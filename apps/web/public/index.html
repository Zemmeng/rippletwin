<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RippleTwin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: operations console — top bar, layer rail | GIS map | analysis panel, risk timeline along the bottom. Dark-first; light theme swaps the basemap too. */
:root{
  color-scheme:dark;
  --map-mode:dark;
  --bg:#07090B;--panel:#0C1014;--raised:#131A20;--line:#22303A;--line-2:#3A4C58;
  --fg:#E8EDF0;--fg-2:#8A99A3;--fg-3:#62707A;
  --accent:#4FE3C1;--on-accent:#04110D;--works:#FFB020;--risk:#FF3B4E;--delta:#FF4FD8;
  --glass:rgba(12,16,20,.84);--glass-line:rgba(58,76,88,.8);
  --tint:rgba(79,227,193,.14);--tint-line:rgba(79,227,193,.45);
  --works-tint:rgba(255,176,32,.14);--risk-tint:rgba(255,59,78,.14);--delta-tint:rgba(255,79,216,.16);
  --shadow:0 12px 32px rgba(0,0,0,.45);
  --a-car:#7FB2FF;--a-bike:#FFD23F;--a-ped:#C792FF;--a-wc:#3CE6E6;--a-bus:#FF8A3D;--a-tram:#8FD16B;
  --tt-moon:rgba(79,227,193,.18);--tt-sun:transparent;--tt-moon-fg:#4FE3C1;--tt-sun-fg:#62707A;
  --f-display:"Space Grotesk","Noto Sans SC",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Inter","Noto Sans SC",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
  --f-mono:"JetBrains Mono","Noto Sans SC",ui-monospace,SFMono-Regular,Menlo,Consolas,"PingFang SC","Microsoft YaHei",monospace;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    color-scheme:light;--map-mode:light;
    --bg:#E7ECEE;--panel:#FFFFFF;--raised:#F3F6F7;--line:#D5DDE1;--line-2:#AAB7BF;
    --fg:#0D1418;--fg-2:#475660;--fg-3:#6C7B85;
    --accent:#08977F;--on-accent:#FFFFFF;--works:#B87200;--risk:#D42037;--delta:#C0198F;
    --glass:rgba(255,255,255,.88);--glass-line:rgba(170,183,191,.85);
    --tint:rgba(8,151,127,.11);--tint-line:rgba(8,151,127,.45);
    --works-tint:rgba(184,114,0,.12);--risk-tint:rgba(212,32,55,.1);--delta-tint:rgba(192,25,143,.1);
    --shadow:0 10px 28px rgba(22,34,44,.14);
    --a-car:#2E6BD9;--a-bike:#A87E00;--a-ped:#7E45CF;--a-wc:#0A8F8F;--a-bus:#D2560F;--a-tram:#3C8F35;
    --tt-moon:transparent;--tt-sun:rgba(8,151,127,.14);--tt-moon-fg:#6C7B85;--tt-sun-fg:#08977F;
  }
}
:root[data-theme="light"]{
  color-scheme:light;--map-mode:light;
  --bg:#E7ECEE;--panel:#FFFFFF;--raised:#F3F6F7;--line:#D5DDE1;--line-2:#AAB7BF;
  --fg:#0D1418;--fg-2:#475660;--fg-3:#6C7B85;
  --accent:#08977F;--on-accent:#FFFFFF;--works:#B87200;--risk:#D42037;--delta:#C0198F;
  --glass:rgba(255,255,255,.88);--glass-line:rgba(170,183,191,.85);
  --tint:rgba(8,151,127,.11);--tint-line:rgba(8,151,127,.45);
  --works-tint:rgba(184,114,0,.12);--risk-tint:rgba(212,32,55,.1);--delta-tint:rgba(192,25,143,.1);
  --shadow:0 10px 28px rgba(22,34,44,.14);
  --a-car:#2E6BD9;--a-bike:#A87E00;--a-ped:#7E45CF;--a-wc:#0A8F8F;--a-bus:#D2560F;--a-tram:#3C8F35;
  --tt-moon:transparent;--tt-sun:rgba(8,151,127,.14);--tt-moon-fg:#6C7B85;--tt-sun-fg:#08977F;
}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 var(--f-body);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font:600 10px/1.2 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--fg-3)}

.app{height:100%;display:grid;grid-template-columns:56px minmax(0,1fr) 384px;grid-template-rows:52px minmax(0,1fr) 88px;grid-template-areas:"top top top" "rail map panel" "rail time time"}

/* ---------- top bar ---------- */
.top{grid-area:top;display:flex;align-items:center;gap:18px;padding:0 16px;background:var(--panel);border-bottom:1px solid var(--line);min-width:0}
.brand{display:flex;align-items:center;gap:9px;flex:none}
.scene{display:flex;align-items:baseline;gap:10px;min-width:0;padding-left:18px;border-left:1px solid var(--line)}
.scene-name{font:500 12.5px/1.2 var(--f-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stepper{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:none}
.stepper::-webkit-scrollbar{display:none}
.stepper button{font:500 10.5px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3);background:none;border:1px solid transparent;border-radius:4px;padding:9px 11px;cursor:pointer;white-space:nowrap;display:flex;gap:7px;align-items:center}
.stepper button:hover{color:var(--fg)}
.stepper button .n{opacity:.8}
.stepper button.done{color:var(--fg-2)}
.stepper button[aria-current="step"]{color:var(--accent);background:var(--tint);border-color:var(--tint-line)}
.top-right{margin-left:auto;display:flex;gap:10px;align-items:center;flex:none}
.chip{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:6px 11px;background:var(--raised);border:1px solid var(--line);white-space:nowrap}
.chip b{font:700 11.5px/1 var(--f-mono);font-variant-numeric:tabular-nums}
.theme-toggle{display:inline-flex;gap:2px;padding:3px;border-radius:999px;background:var(--raised);border:1px solid var(--line);cursor:pointer}
.theme-toggle span{width:28px;height:22px;border-radius:999px;display:grid;place-items:center}
.theme-toggle .moon{background:var(--tt-moon);color:var(--tt-moon-fg)}
.theme-toggle .sun{background:var(--tt-sun);color:var(--tt-sun-fg)}
.lang-toggle{display:inline-flex;gap:2px;padding:3px;border-radius:999px;background:var(--raised);border:1px solid var(--line);cursor:pointer}
.lang-toggle span{min-width:30px;height:22px;padding:0 6px;border-radius:999px;display:grid;place-items:center;font:600 11px/1 var(--f-mono);color:var(--fg-3)}
.lang-toggle span.on{background:var(--tint);color:var(--accent)}
:lang(zh) .eyebrow,:lang(zh) .stepper button,:lang(zh) .wx button,:lang(zh) .basemap button,:lang(zh) .pill,:lang(zh) .legend-head .ttl,:lang(zh) .legend-metrics dt{letter-spacing:.04em;text-transform:none}

/* ---------- rail ---------- */
.rail{grid-area:rail;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 0}
.rail button{width:40px;height:40px;border-radius:8px;border:1px solid transparent;background:none;color:var(--fg-2);display:grid;place-items:center;cursor:pointer;position:relative}
.rail button:hover{color:var(--fg);background:var(--raised)}
.rail button[aria-pressed="true"]{color:var(--accent);background:var(--tint);border-color:var(--tint-line)}
.rail button[data-tip]:hover::after{content:attr(data-tip);position:absolute;left:48px;top:50%;transform:translateY(-50%);background:var(--glass);border:1px solid var(--glass-line);color:var(--fg);font:500 11px/1 var(--f-mono);padding:6px 8px;border-radius:4px;white-space:nowrap;z-index:10;pointer-events:none}
.rail .sep{width:24px;height:1px;background:var(--line);margin:4px 0}

/* ---------- map ---------- */
.map{grid-area:map;position:relative;overflow:hidden;background:var(--bg);container-type:inline-size;touch-action:none;min-height:0}
.map canvas{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab}
.map canvas.dragging{cursor:grabbing}
.hud{position:absolute;inset:0;pointer-events:none}
.hud>*{pointer-events:auto}
.glass{background:var(--glass);border:1px solid var(--glass-line);border-radius:6px;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:var(--shadow)}
.wx{position:absolute;top:14px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:2px;padding:3px;max-width:calc(100% - 28px);overflow-x:auto;scrollbar-width:none}
.wx::-webkit-scrollbar{display:none}
.wx .lbl{font:700 10px/1 var(--f-mono);letter-spacing:.1em;color:var(--fg-3);padding:0 8px 0 7px;white-space:nowrap;flex:none}
.wx button{display:flex;align-items:center;gap:6px;border:1px solid transparent;background:none;color:var(--fg-2);border-radius:4px;padding:6px 8px;cursor:pointer;font:500 10.5px/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.wx button .t{display:none}
.wx button:hover{color:var(--fg)}
.wx button[aria-checked="true"]{color:var(--fg);background:var(--wxc-tint,var(--tint));border-color:var(--wxc,var(--tint-line))}
.wx button[aria-checked="true"] .t{display:inline}
.wx button[aria-checked="true"] svg{color:var(--wxc)}
.basemap{position:absolute;top:14px;right:14px;display:flex;gap:2px;padding:3px}
.basemap button{border:0;background:none;color:var(--fg-2);font:500 10.5px/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;padding:7px 10px;border-radius:4px;cursor:pointer}
.basemap button[aria-pressed="true"]{background:var(--tint);color:var(--accent)}
.zoom{position:absolute;right:14px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;padding:3px;gap:2px}
.zoom button{width:30px;height:30px;border:0;background:none;color:var(--fg-2);border-radius:4px;cursor:pointer;display:grid;place-items:center;font:600 16px/1 var(--f-mono)}
.zoom button:hover{background:var(--raised);color:var(--fg)}
.legend{position:absolute;left:14px;bottom:52px;width:272px;padding:11px 12px 12px;display:flex;flex-direction:column;gap:9px}
.legend-head{display:flex;align-items:center;gap:8px}
.legend-head .ttl{font:700 10px/1.2 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;flex:1;min-width:0}
.legend-head svg{color:var(--wxc,var(--accent));flex:none}
.live{font:700 8.5px/1 var(--f-mono);letter-spacing:.08em;padding:3px 5px;border-radius:3px;background:var(--wxc-tint,var(--tint));color:var(--wxc,var(--accent))}
.legend-toggle{border:0;background:none;color:var(--fg-3);cursor:pointer;padding:2px;display:grid;place-items:center}
.legend-ramp{height:8px;border-radius:2px}
.legend-scale{display:flex;justify-content:space-between;font:400 9.5px/1 var(--f-mono);color:var(--fg-2)}
.legend-scale .u{color:var(--fg-3);letter-spacing:.08em;text-transform:uppercase;font-size:8.5px}
.legend-metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px;margin:0}
.legend-metrics div{min-width:0}
.legend-metrics dt{font:400 9px/1.2 var(--f-mono);color:var(--fg-3);letter-spacing:.06em;text-transform:uppercase}
.legend-metrics dd{margin:2px 0 0;font:700 13px/1.2 var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.legend-impact{margin:0;padding-top:8px;border-top:1px solid var(--line);font-size:11.5px;line-height:1.45}
.legend-impact b{display:block;font:600 8.5px/1.2 var(--f-mono);letter-spacing:.1em;color:var(--fg-3);margin-bottom:3px}
.legend-src{margin:0;font:400 9px/1.35 var(--f-mono);color:var(--fg-3)}
.legend.collapsed .legend-body{display:none}
.legend-body{display:flex;flex-direction:column;gap:9px}
.probe{position:absolute;right:14px;bottom:14px;padding:7px 10px;font:400 10.5px/1.5 var(--f-mono);font-variant-numeric:tabular-nums;display:flex;gap:12px;flex-wrap:wrap;max-width:calc(100% - 320px)}
.probe .k{color:var(--fg-3)}
.probe .v{color:var(--fg)}
.probe .hl{color:var(--wxc,var(--accent));font-weight:700}
.alert{position:absolute;width:268px;padding:13px 14px;border-color:var(--risk);display:flex;flex-direction:column;gap:9px;box-shadow:0 0 0 1px var(--risk-tint),0 12px 36px rgba(255,59,78,.25)}
.alert .h{display:flex;align-items:center;gap:8px;font:700 10.5px/1 var(--f-mono);letter-spacing:.1em;color:var(--risk)}
.alert .h i{width:8px;height:8px;border-radius:50%;background:var(--risk);box-shadow:0 0 10px var(--risk)}
.alert .ttl{font:700 17px/1.2 var(--f-display)}
.alert .m{display:flex;gap:16px}
.alert .m div{display:flex;flex-direction:column;gap:2px}
.alert .m span{font:400 9px/1 var(--f-mono);color:var(--fg-3);letter-spacing:.08em}
.alert .m b{font:700 14px/1 var(--f-mono)}
.swipe{position:absolute;top:0;bottom:0;width:0;pointer-events:none}
.swipe .line{position:absolute;top:0;bottom:0;left:-1px;width:2px;background:var(--fg);opacity:.85;box-shadow:0 0 0 1px rgba(0,0,0,.25)}
.swipe .knob{position:absolute;top:50%;left:-17px;width:34px;height:34px;margin-top:-17px;border-radius:50%;background:var(--fg);color:var(--bg);border:0;display:grid;place-items:center;cursor:ew-resize;pointer-events:auto;box-shadow:var(--shadow)}
.swipe .tag{position:absolute;top:58px;font:700 9.5px/1 var(--f-mono);letter-spacing:.08em;padding:5px 7px;border-radius:3px;white-space:nowrap}
.swipe .tag.l{right:10px;background:var(--risk);color:#fff}
.swipe .tag.r{left:10px;background:var(--accent);color:var(--on-accent)}
.toast{position:absolute;left:50%;bottom:60px;transform:translateX(-50%);padding:9px 14px;font-size:12.5px;z-index:20}
.loading{position:absolute;inset:0;display:grid;place-items:center;font:500 11px/1 var(--f-mono);letter-spacing:.1em;color:var(--fg-3);background:var(--bg)}

@container (max-width: 700px){ .probe{display:none} .legend{bottom:44px;width:min(272px,calc(100% - 28px))} .zoom{top:auto;bottom:100px;transform:none} .basemap{top:58px;right:14px} }

/* ---------- panel ---------- */
.panel{grid-area:panel;background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;padding:20px 22px 22px;display:flex;flex-direction:column;gap:18px;min-width:0}
.panel h2{font:700 21px/1.25 var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.panel p{margin:0}
.muted{color:var(--fg-2)}
.small{font-size:12px;line-height:1.5}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:7px}
.pill{display:inline-flex;align-items:center;gap:6px;font:700 9.5px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;padding:4px 7px;border-radius:3px;border:1px solid var(--line-2);color:var(--fg-2);white-space:nowrap}
.pill.risk{background:var(--risk);border-color:var(--risk);color:#fff}
.pill.ok{background:var(--tint);border-color:var(--tint-line);color:var(--accent)}
.pill.warn{background:var(--works-tint);border-color:var(--works);color:var(--works)}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.pulse{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.card{background:var(--raised);border:1px solid var(--line);border-radius:6px}
.list{background:var(--raised);border:1px solid var(--line);border-radius:6px}
.list>div{display:flex;align-items:center;gap:10px;padding:9px 12px;min-width:0}
.list>div+div{border-top:1px solid var(--line)}
.list .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list .val{font:400 10.5px/1.2 var(--f-mono);color:var(--fg-2);white-space:nowrap}
.sw{width:9px;height:9px;border-radius:2px;flex:none}
.bars{display:flex;flex-direction:column;gap:8px}
.bars .b{display:grid;grid-template-columns:14px 1fr 104px 28px;align-items:center;gap:8px;font-size:12.5px}
.bars .track{height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.bars .track i{display:block;height:100%;border-radius:2px}
.bars .n{font:500 11px/1 var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button,.chips span{font:500 10.5px/1 var(--f-mono);padding:6px 9px;border-radius:4px;border:1px solid var(--line);background:var(--raised);color:var(--fg-2);cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chips [aria-pressed="true"]{background:var(--tint);border-color:var(--tint-line);color:var(--accent)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:1px solid transparent;border-radius:6px;padding:13px 16px;font:600 14px/1 var(--f-body);cursor:pointer;background:var(--accent);color:var(--on-accent)}
.btn:hover{filter:brightness(1.06)}
.btn:disabled{cursor:not-allowed;background:var(--raised);color:var(--fg-3);border-color:var(--line)}
.btn.ghost{background:var(--raised);color:var(--fg);border-color:var(--line-2)}
.btn.danger{background:var(--risk-tint);color:var(--risk);border-color:var(--risk)}
.cta{display:flex;flex-direction:column;gap:8px;margin-top:auto;padding-top:4px}
.cta-act:empty{display:none}
.cta-act .btn{width:100%}
.cta .note{font:400 9.5px/1.3 var(--f-mono);color:var(--fg-3);text-align:center}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.metric{background:var(--raised);border:1px solid var(--line);border-radius:6px;padding:10px 12px;min-width:0}
.metric .v{font:700 21px/1.1 var(--f-mono);font-variant-numeric:tabular-nums;margin-top:5px;display:flex;align-items:baseline;gap:6px}
.metric .v small{font:400 9.5px/1 var(--f-mono);color:var(--fg-3)}
.progress{padding:13px 14px;display:flex;flex-direction:column;gap:9px}
.progress .track{height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.progress .track i{display:block;height:100%;background:var(--accent);border-radius:2px;transition:width .4s}
.big{font:700 24px/1 var(--f-mono);font-variant-numeric:tabular-nums}
.chain{display:flex;flex-direction:column}
.chain .c{display:grid;grid-template-columns:24px 1fr;gap:12px;cursor:pointer;border-radius:6px;padding:4px 6px 4px 0}
.chain .c:hover,.chain .c.on{background:var(--raised)}
.chain .rail2{display:flex;flex-direction:column;align-items:center}
.chain .badge{width:24px;height:24px;border-radius:50%;border:2px solid var(--bc);color:var(--bc);display:grid;place-items:center;font:700 10.5px/1 var(--f-mono);background:var(--panel);flex:none}
.chain .ln{width:2px;flex:1;background:var(--line-2);min-height:10px;margin:2px 0}
.chain .tx{padding-bottom:12px;min-width:0}
.chain .tx b{display:block;font:500 13px/1.35 var(--f-body)}
.chain .tx span{display:block;font:400 10.5px/1.45 var(--f-mono);color:var(--fg-2)}
.seeds{display:grid;grid-template-columns:repeat(25,1fr);gap:3px}
.seeds i{height:7px;border-radius:1px;background:var(--line)}
.seeds i.hit{background:var(--risk)}
.agents3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.agents3 div{background:var(--raised);border:1px solid var(--line);border-radius:6px;padding:9px 10px;min-width:0}
.agents3 b{font:700 10.5px/1 var(--f-mono);display:flex;gap:6px;align-items:center}
.agents3 span{display:block;font-size:11.5px;margin-top:5px}
.agents3 small{display:block;font:400 9.5px/1.3 var(--f-mono);color:var(--fg-2);margin-top:2px}
.table{background:var(--raised);border:1px solid var(--line);border-radius:6px}
.table>div{display:grid;grid-template-columns:1fr 58px 14px 58px;align-items:center;gap:6px;padding:8px 12px;font-size:12px}
.table>div+div{border-top:1px solid var(--line)}
.table .o{font:400 11px/1 var(--f-mono);color:var(--fg-3);text-decoration:line-through;text-align:right}
.table .a{font:700 12px/1 var(--f-mono);text-align:right}
.table .ar{color:var(--fg-3);font:400 11px/1 var(--f-mono);text-align:center}
.score{display:flex;align-items:center;gap:16px}
.delta{display:inline-grid;place-items:center;min-width:24px;height:17px;padding:0 4px;border-radius:2px;background:var(--delta);color:#fff;font:700 9.5px/1 var(--f-mono)}
.pre{white-space:pre-wrap;font:400 11px/1.5 var(--f-mono);background:var(--raised);border:1px solid var(--line);border-radius:6px;padding:10px;max-height:220px;overflow:auto;user-select:all}

/* ---------- timeline ---------- */
.timeline{grid-area:time;background:var(--panel);border-top:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:0 16px;min-width:0}
.play{width:40px;height:40px;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;cursor:pointer;flex:none}
.clock{display:flex;flex-direction:column;gap:3px;flex:none;min-width:106px}
.clock b{font:700 17px/1 var(--f-mono);font-variant-numeric:tabular-nums}
.speed{display:flex;gap:2px;padding:2px;border:1px solid var(--line);border-radius:5px;flex:none}
.speed button{border:0;background:none;color:var(--fg-3);font:500 10.5px/1 var(--f-mono);padding:6px 7px;border-radius:3px;cursor:pointer}
.speed button[aria-pressed="true"]{background:var(--tint);color:var(--accent)}
.hist{flex:1;min-width:0;height:64px;position:relative}
.hist canvas{width:100%;height:100%;display:block;cursor:pointer}

/* ---------- responsive ---------- */
@media (max-width:1180px){ .app{grid-template-columns:52px minmax(0,1fr) 330px} .scene{display:none} }
@media (max-width:820px){
  body{overflow:auto}
  .app{height:auto;min-height:100%;grid-template-columns:minmax(0,1fr);grid-template-rows:auto 66vh auto auto;grid-template-areas:"top" "map" "time" "panel"}
  .top{flex-wrap:wrap;gap:8px 12px;padding:10px 16px}
  .stepper{order:3;width:100%}
  .rail{display:none}
  .map{min-height:380px}
  .panel{border-left:0;border-top:1px solid var(--line);padding:20px 16px}
  .timeline{flex-wrap:wrap;padding:12px 16px;gap:10px 14px}
  .hist{flex-basis:100%;order:5}
}
@media (prefers-reduced-motion: reduce){ .pulse{animation:none} .progress .track i{transition:none} }

/* ---------- engine wiring (T13) ---------- */
.eng-note{padding:11px 13px;display:flex;flex-direction:column;gap:4px}
.eng-note b{font:600 12.5px/1.35 var(--f-body)}
.eng-note span{font:400 10.5px/1.45 var(--f-mono);color:var(--fg-2)}
.eng-note.warn{border-color:var(--works);background:var(--works-tint)}
.eng-zone{font-size:12.5px}
.eng-zone .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.eng-vms{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.eng-vms textarea{width:100%;height:96px;resize:none;padding:8px 9px;border-radius:4px;border:1px solid var(--line-2);background:#0A0A0A;color:#FFB020;font:700 13px/1.4 var(--f-mono);letter-spacing:.08em;text-transform:uppercase}
.eng-vms textarea::placeholder{color:#6b5a33}
.eng-vms textarea:focus-visible,.eng-field input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input[type="range"]#vmsAt{width:100%;accent-color:var(--accent)}
.eng-field{display:flex;flex-direction:column;gap:5px}
.eng-field input{width:100%;padding:8px 9px;border-radius:4px;border:1px solid var(--line-2);background:var(--raised);color:var(--fg);font:600 12px/1.3 var(--f-mono);letter-spacing:.06em;text-transform:uppercase}
.eng-msg{font:500 11px/1.4 var(--f-mono);padding:6px 9px;border-radius:4px}
.eng-msg.err{color:var(--risk);background:var(--risk-tint)}
.eng-msg.warn{color:var(--works);background:var(--works-tint)}
.eng-out{display:flex;flex-direction:column;gap:9px;transition:opacity .2s}
.eng-out.stale{opacity:.55}
.eng-badges{gap:5px}
.eng-badges .pill{cursor:default}
.eng-seg{display:flex;gap:2px;padding:3px;border:1px solid var(--line);border-radius:6px;background:var(--raised)}
.eng-seg button{flex:1;min-width:0;border:0;background:none;color:var(--fg-2);font:600 10px/1.25 var(--f-mono);letter-spacing:.05em;text-transform:uppercase;padding:8px 6px;border-radius:4px;cursor:pointer}
.eng-seg button[aria-selected="true"]{background:var(--tint);color:var(--accent)}
:lang(zh) .eng-seg button{letter-spacing:.02em;text-transform:none}
/* T40 step 2 on SUMO: source pill + reason, scenario chips, re-run button */
.sumo-src{flex-wrap:wrap;gap:6px 8px}
.sumo-src .small{line-height:1.3}
.sumo-seg button{white-space:normal}
.sumo-run{padding:10px 12px;font-size:13px}
.sumo-run [data-live]{font-variant-numeric:tabular-nums}
/* T42: cloud SUMO run in progress; seed box */
.sumo-wait{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--line-2);border-radius:10px;font-size:13px}
.sumo-wait [data-live]{font-variant-numeric:tabular-nums}
.spin{flex:none;width:16px;height:16px;border:2px solid var(--line-2);border-top-color:var(--works);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2.4s}}
.sumo-seed{flex-wrap:wrap;gap:6px 8px;align-items:center}
.sumo-seed input{width:120px;padding:8px 10px;border:1px solid var(--line-2);border-radius:8px;background:transparent;color:inherit;font:inherit;font-variant-numeric:tabular-nums}
.sumo-seed .btn{padding:8px 12px;font-size:13px}
.eng-routes{display:flex;flex-direction:column;gap:8px}
.eng-route{display:grid;grid-template-columns:minmax(0,1fr) 60px 34px 86px;align-items:center;gap:8px;font-size:12.5px}
.eng-route .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.eng-route.stay .nm{color:var(--works)}
.eng-route .track{height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.eng-route .track i{display:block;height:100%;background:var(--accent);border-radius:2px}
.eng-route.stay .track i{background:var(--works)}
.eng-route .n{font:600 11px/1 var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}
.eng-route .t{font:400 10.5px/1 var(--f-mono);color:var(--fg-2);text-align:right;white-space:nowrap}
.eng-route .t s{color:var(--fg-3);margin-left:4px}
.eng-types>div{align-items:flex-start}
.eng-type .dot{margin-top:5px}
.eng-type small{display:block;font:400 10.5px/1.4 var(--f-mono);color:var(--fg-2);margin-top:3px;white-space:normal}
.eng-tv{display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex:none;font:400 9.5px/1.2 var(--f-mono);color:var(--fg-3)}
.eng-tv b{font:700 14px/1 var(--f-mono);color:var(--works)}
.eng-hot{cursor:pointer}
.eng-hot:hover,.eng-hot:focus-visible{background:var(--panel)}
.eng-hot .rk{font:700 10px/1 var(--f-mono);color:var(--fg-3);width:12px}
.eng4{gap:10px}
.eng-opts{gap:6px}
.eng-opt{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 12px;border-radius:6px;border:1px solid var(--line);background:var(--raised);cursor:pointer}
.eng-opt[aria-pressed="true"]{border-color:var(--tint-line);background:var(--tint)}
.eng-opt:disabled{cursor:not-allowed;opacity:.6}
.eng-opt .k{font:700 9px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;padding:4px 6px;border-radius:3px;background:var(--delta);color:#fff}
.eng-opt .w{display:flex;flex-direction:column;gap:3px;min-width:0}
.eng-opt .w b{font:500 12.5px/1.35 var(--f-body)}
.eng-opt .w .mono{font-size:10.5px;color:var(--works);overflow-wrap:anywhere}
.eng-opt .d{font:700 12px/1 var(--f-mono);white-space:nowrap}
.eng-table>div{grid-template-columns:1fr 66px 14px 66px}
.eng-legend{display:flex;flex-wrap:wrap;gap:6px 14px;font:500 10px/1.2 var(--f-mono);color:var(--fg-2)}
.eng-legend span{display:inline-flex;align-items:center;gap:6px}
.eng-legend i{width:16px;height:4px;border-radius:2px;display:inline-block}
/* T44: step 2 — what the safety marks on the map are */
.ev-legend .ev-dia{width:7px;height:7px;border-radius:1px;background:var(--fg);transform:rotate(45deg)} /* diamonds, like the map marks */
.eng-wrap{flex-wrap:wrap;gap:8px}
.eng-impacts>div{padding:7px 11px;font-size:12px}
.eng-impacts .val{font:600 10.5px/1.2 var(--f-mono);color:var(--works)}
.eng-trs>div{align-items:flex-start}
.eng-tr .md{min-width:30px;height:20px;padding:0 5px;border-radius:4px;display:inline-grid;place-items:center;font:700 10.5px/1 var(--f-mono);color:#fff;flex:none}
.eng-tr small{display:block;font:400 10.5px/1.4 var(--f-mono);margin-top:3px;white-space:normal}

/* ============================================================
   T14 liquid glass (docs/hackathon/specs/T14-liquid-glass-PRD.md) — appearance only.
   Desktop: the map fills the window and every panel floats over it as glass; .app's --safe-* say how much of the map
   the glass covers (js/7-glass.js keeps the view, scale bar and alert inside the rest). Refraction on .panel / .top
   comes from js/7-glass.js (liquid-glass.js by Deepika Rao, MIT); everything here is the frosted base it sits on.
   Apple-style clear glass (09-29 ask, lead: clearer still): the tint is light (~.3); --glass-tone dims the map behind it (dark) or lifts it
   (light) so text still clears 4.5:1. Reduced transparency or no backdrop-filter → solid surfaces.
   ============================================================ */
:root,:root[data-theme="dark"]{
  --bg:#07090B;--raised:rgba(255,255,255,.07);--line:rgba(255,255,255,.12);--line-2:rgba(255,255,255,.24);
  --fg:#F7F9FA;--fg-2:#CDD4D9;--fg-3:#B8C1C7;
  --panel:rgba(22,27,34,.30);--glass:rgba(22,27,34,.28);--glass-line:rgba(255,255,255,.18);
  --shell:rgba(22,27,34,.30);--shell-line:rgba(255,255,255,.16);--shell-solid:#0F1419;
  --glass-tone:brightness(.44) saturate(1.9);
  --tone-deep:brightness(.44) saturate(1.9);--shell-deep:rgba(22,27,34,.30);--glass-deep:rgba(22,27,34,.28);--tone-fog:brightness(.29) saturate(1.6);--tone-fog-deep:brightness(.29) saturate(1.6);
  --shadow:0 20px 50px rgba(0,0,0,.36);
  --rim:inset 1.5px 1.5px 0 -.5px rgba(255,255,255,.42),inset -1px -1px 0 rgba(255,255,255,.12),inset 0 0 0 1px rgba(255,255,255,.05),inset 0 26px 40px -34px rgba(255,255,255,.38);
  --hl:rgba(255,255,255,.08);--hl-2:rgba(255,255,255,.05);--hl-edge:rgba(255,255,255,.18);
  --sun:#FF9F0A;--sun-tint:rgba(255,159,10,.16);--on-sun:#1B1000;--sun-ink:#FFB340;
  --tt-moon:var(--sun);--tt-moon-fg:var(--on-sun);--tt-sun:transparent;--tt-sun-fg:var(--fg-3);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#E7ECEE;--raised:rgba(255,255,255,.42);--line:rgba(17,27,34,.12);--line-2:rgba(17,27,34,.24);
    --fg:#0B1013;--fg-2:#35414A;--fg-3:#4E5B64;
    --panel:rgba(255,255,255,.32);--glass:rgba(255,255,255,.32);--glass-line:rgba(255,255,255,.72);
    --shell:rgba(255,255,255,.30);--shell-line:rgba(255,255,255,.78);--shell-solid:#FFFFFF;
    --glass-tone:brightness(1.24) contrast(.8) saturate(1.8);
    --tone-deep:brightness(1.9) contrast(.45) saturate(1.4);--shell-deep:rgba(255,255,255,.72);--glass-deep:rgba(255,255,255,.72);--tone-fog:brightness(1.24) contrast(.8) saturate(1.8);--tone-fog-deep:brightness(1.9) contrast(.45) saturate(1.4);
    --shadow:0 18px 44px rgba(28,40,50,.14);
    --rim:inset 1.5px 1.5px 0 -.5px rgba(255,255,255,.98),inset -1px -1px 0 rgba(255,255,255,.6),inset 0 0 0 1px rgba(255,255,255,.3),inset 0 -22px 34px -28px rgba(255,255,255,.75);
    --hl:rgba(255,255,255,.58);--hl-2:rgba(255,255,255,.22);--hl-edge:rgba(255,255,255,.9);
    --sun:#F08A00;--sun-tint:rgba(240,138,0,.14);--on-sun:#1E1100;--sun-ink:#874800;
    --tt-moon:transparent;--tt-moon-fg:var(--fg-3);--tt-sun:var(--sun);--tt-sun-fg:var(--on-sun);
  }
}
:root[data-theme="light"]{
  --bg:#E7ECEE;--raised:rgba(255,255,255,.42);--line:rgba(17,27,34,.12);--line-2:rgba(17,27,34,.24);
  --fg:#0B1013;--fg-2:#35414A;--fg-3:#4E5B64;
  --panel:rgba(255,255,255,.32);--glass:rgba(255,255,255,.32);--glass-line:rgba(255,255,255,.72);
  --shell:rgba(255,255,255,.30);--shell-line:rgba(255,255,255,.78);--shell-solid:#FFFFFF;
  --glass-tone:brightness(1.24) contrast(.8) saturate(1.8);
  --tone-deep:brightness(1.9) contrast(.45) saturate(1.4);--shell-deep:rgba(255,255,255,.72);--glass-deep:rgba(255,255,255,.72);--tone-fog:brightness(1.24) contrast(.8) saturate(1.8);--tone-fog-deep:brightness(1.9) contrast(.45) saturate(1.4);
  --shadow:0 18px 44px rgba(28,40,50,.14);
  --rim:inset 1.5px 1.5px 0 -.5px rgba(255,255,255,.98),inset -1px -1px 0 rgba(255,255,255,.6),inset 0 0 0 1px rgba(255,255,255,.3),inset 0 -22px 34px -28px rgba(255,255,255,.75);
  --hl:rgba(255,255,255,.58);--hl-2:rgba(255,255,255,.22);--hl-edge:rgba(255,255,255,.9);
  --sun:#F08A00;--sun-tint:rgba(240,138,0,.14);--on-sun:#1E1100;--sun-ink:#874800;
  --tt-moon:transparent;--tt-moon-fg:var(--fg-3);--tt-sun:var(--sun);--tt-sun-fg:var(--on-sun);
}

/* glass adapts to what is behind it (like Apple's): over dark content (imagery / NIR basemap, heat layer) light glass
   lifts harder and turns milkier (dark text needs a near-white ground for 4.5:1); over fog's near-white map dark
   glass dims harder. Each theme sets its own
   --tone-deep / --tone-fog(-deep), so these rules hold for both. data-bm / data-wx are set in js/5-app.js. */
:root[data-bm="imagery"],:root[data-bm="nir"],:root[data-wx="heat"]{--glass-tone:var(--tone-deep);--shell:var(--shell-deep);--glass:var(--glass-deep)}
:root[data-wx="fog"]{--glass-tone:var(--tone-fog)}
:root[data-wx="fog"][data-bm="imagery"],:root[data-wx="fog"][data-bm="nir"]{--glass-tone:var(--tone-fog-deep)}

/* glass surfaces: a light tint over a toned backdrop, a sheen across the top-left, a lit rim (brighter top-left,
   fainter bottom-right) and a soft inner glow for thickness */
.top,.rail,.panel,.timeline,.panel-open{
  background:linear-gradient(150deg,var(--hl),transparent 36%,transparent 72%,var(--hl-2)),var(--shell);
  border:1px solid var(--shell-line);
  -webkit-backdrop-filter:blur(20px) var(--glass-tone);backdrop-filter:blur(20px) var(--glass-tone);
  box-shadow:var(--shadow),var(--rim);
}
.glass{
  background:linear-gradient(150deg,var(--hl),transparent 40%,transparent 74%,var(--hl-2)),var(--glass);
  border:1px solid var(--glass-line);border-radius:16px;
  -webkit-backdrop-filter:blur(16px) var(--glass-tone);backdrop-filter:blur(16px) var(--glass-tone);
  box-shadow:0 12px 32px rgba(0,0,0,.2),var(--rim);
}
/* real refraction (js/7-glass.js sets --lg-url on the panel and the top bar) */
.lg-on{-webkit-backdrop-filter:var(--lg-url) blur(var(--lg-blur,12px)) var(--glass-tone);backdrop-filter:var(--lg-url) blur(var(--lg-blur,12px)) var(--glass-tone)}

.brand-logo::before{content:"";position:absolute;inset:0;background:var(--fg);-webkit-mask:var(--logo-ripple) left center/contain no-repeat;mask:var(--logo-ripple) left center/contain no-repeat}
.scene{border:1px solid var(--line);border-radius:999px;padding:7px 12px;background:var(--raised)}
.stepper{gap:4px}
.stepper button{border-radius:999px;padding:9px 12px;transition:background .18s,color .18s}
.stepper button:hover{background:var(--raised)}
.stepper button[aria-current="step"]{color:var(--on-sun);background:var(--sun);border-color:rgba(255,255,255,.3);box-shadow:0 6px 18px rgba(255,159,10,.24),inset 0 1px 0 rgba(255,255,255,.42)}
.chip,.theme-toggle,.lang-toggle{background:var(--raised);border-color:var(--line);box-shadow:inset 0 1px 0 var(--hl-edge)}

/* layer rail */
.rail button{width:36px;height:36px;border-radius:12px;transition:background .18s,color .18s}
.rail button svg{width:17px;height:17px}
.rail .sep{width:20px;margin:2px 0}
.rail button[aria-pressed="true"]{color:var(--on-sun);background:var(--sun);border-color:rgba(255,255,255,.3);box-shadow:0 6px 16px rgba(255,159,10,.22),inset 0 1px 0 rgba(255,255,255,.45)}
.rail button[data-tip]:hover::after{left:46px;padding:7px 10px;border-radius:10px;-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);box-shadow:var(--shadow)}

/* map HUDs */
.wx,.basemap,.zoom,.probe,.toast{border-radius:999px}
.wx{padding:4px;gap:3px}
.wx button,.basemap button{border-radius:999px}
.wx button{padding:7px 10px}
.basemap{padding:4px}
.basemap button{padding:8px 11px}
.basemap button[aria-pressed="true"]{background:var(--sun);color:var(--on-sun)}
.zoom{padding:4px;gap:2px}
.zoom button{width:32px;height:32px;border-radius:50%}
.legend{border-radius:18px;padding:13px 14px 14px}
.legend-ramp{border-radius:999px}
.probe{padding:8px 13px}
.toast{padding:10px 16px}
.alert{border-radius:20px;background:linear-gradient(135deg,rgba(255,255,255,.10),transparent 38%),rgba(40,10,15,.86);color:#F5F7F8}
.alert .m span{color:#B3A3A6}
.swipe .knob{background:var(--sun);color:var(--on-sun);border:1px solid rgba(255,255,255,.45)}
.swipe .tag{border-radius:999px;padding:6px 9px}

/* analysis panel */
.panel{scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
.panel h2{font-size:22px;line-height:1.18;letter-spacing:-.025em}
.pill{border-radius:999px;padding:5px 8px}
.card,.list,.metric,.agents3 div,.table,.pre,.eng-seg,.eng-opt{border-radius:14px;box-shadow:inset 0 1px 0 var(--hl-edge)}
.card,.list,.metric,.agents3 div,.table,.pre{background:linear-gradient(135deg,rgba(255,255,255,.06),transparent 50%),var(--raised)}
.list>div{padding:10px 13px}
.progress .track,.bars .track,.eng-route .track{border-radius:999px}
.chips button,.chips span{border-radius:999px;padding:7px 10px}
.btn{border-radius:14px;box-shadow:0 10px 22px rgba(79,227,193,.16),inset 0 1px 0 rgba(255,255,255,.28)}
.btn.ghost,.btn:disabled{box-shadow:inset 0 1px 0 var(--hl-edge)}
.chain .c{border-radius:12px}
.chain .badge{background:var(--shell-solid)}
.eng-seg{padding:3px}
.eng-seg button{border-radius:11px}
.eng-seg button[aria-selected="true"]{background:var(--sun);color:var(--on-sun)}
.eng-opt[aria-pressed="true"]{border-color:var(--sun);background:var(--sun-tint)}
.eng-field input{border-radius:10px}
.eng-vms textarea{border-radius:10px;border-color:#2A2A2A;box-shadow:inset 0 2px 8px rgba(0,0,0,.6)}
.eng-msg{border-radius:10px}

/* compact panel: explanatory copy hides, secondary sections fold behind their heading */
.panel-tools{display:flex;align-items:center;gap:8px;margin-bottom:-4px}
.seg-mode{display:inline-flex;gap:2px;padding:3px;border-radius:999px;border:1px solid var(--line);background:var(--raised)}
.seg-mode button{border:0;background:none;color:var(--fg-2);font:600 10px/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;padding:7px 11px;border-radius:999px;cursor:pointer}
.seg-mode button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
:lang(zh) .seg-mode button{letter-spacing:.02em;text-transform:none}
.panel-hide{margin-left:auto;width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--raised);color:var(--fg-2);display:none;place-items:center;cursor:pointer}
.panel-hide:hover{color:var(--fg)}
.panel.compact p.muted{display:none}
/* Compact (the default view): numbers, actions and one-line assumptions. Source footnotes, each plan's AI write-up (it repeats
   the numbers on the card) and the reason behind the advisor's pick are in Details (09-30, tutor: limit the words) */
.panel.compact .legend-src,.panel.compact .cmp-explain,.panel.compact .cmp-lean-why,.panel.compact .eng-badges,.panel.compact .eng-impacts,.panel.compact .eng-units,.panel.compact .note-more,.panel.compact .eng-assume{display:none}
.panel.compact #copyFallback p.muted{display:block}
.sec-head{cursor:pointer;border-radius:10px;margin:-4px -6px;padding:4px 6px;user-select:none}
.sec-head:hover{background:var(--raised)}
.sec-head::after{content:"";flex:none;width:7px;height:7px;margin:0 4px 3px auto;border-right:1.6px solid var(--fg-3);border-bottom:1.6px solid var(--fg-3);transform:rotate(45deg);transition:transform .18s}
.sec-head.between::after{margin-left:0}
.sec-closed>.sec-head::after{transform:rotate(-45deg);margin-bottom:0}
.sec-closed>:not(.sec-head){display:none!important}
.panel-open{display:none}

/* one action colour (09-29): every primary / selected control is --sun; teal stays only where it means
   "better / after repair" (numbers, the v2 tag, OK pills) and on map overlays (AOI, graticule) */
button:focus-visible,[tabindex]:focus-visible,.eng-vms textarea:focus-visible,.eng-field input:focus-visible{outline-color:var(--sun)}
.btn{background:var(--sun);color:var(--on-sun);box-shadow:0 10px 22px rgba(255,159,10,.22),inset 0 1px 0 rgba(255,255,255,.4)}
.play{background:var(--sun);color:var(--on-sun);box-shadow:0 8px 20px rgba(255,159,10,.26),inset 0 1px 0 rgba(255,255,255,.45)}
.chips [aria-pressed="true"],.lang-toggle span.on,.speed button[aria-pressed="true"]{background:var(--sun);border-color:transparent;color:var(--on-sun)}
.speed{border-radius:999px;padding:3px}
.speed button{border-radius:999px}
.progress .track i{background:var(--sun)}
input[type="range"]#vmsAt{accent-color:var(--sun)}

/* T20: assumptions and units, always visible (not .muted: the compact view hides .muted) */
.eng-assume{margin:0;font:400 11.5px/1.5 var(--f-body);color:var(--fg-2)}
.eng-assume p{margin:0}
.eng-assume p+p{margin-top:4px}
.eng-opt .d small{display:block;margin-top:3px;font:500 9.5px/1 var(--f-mono);color:var(--fg-3);text-align:right}
/* T20 addendum 4: the 17:00 timeline belongs to the junction micro-model; hidden when that scene is not on screen */
.app.no-time .timeline{display:none}

/* data credits (OSM / DataVic / City of Melbourne): plain text centred along the foot of the open map on desktop (no frame,
   09-30 ask; a soft halo in the shell colour keeps it legible over imagery). It gets its own band (--cr-h): the scale bar,
   weather chip, probe and toast sit above it, so it never runs into them however it wraps. A footer line on phones */
.credits{font:400 10.5px/1.45 var(--f-body);color:var(--fg-2);display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 6px}
.credits a{color:inherit;text-decoration:none;border-bottom:1px dotted currentColor}
.credits a:hover{color:var(--fg)}
.credits .cr-k{font:600 9.5px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3)}
:lang(zh) .credits .cr-k{letter-spacing:.02em}
.credits .cr-sep{color:var(--fg-3)}
.pd-src{margin-top:14px}

/* ---------- floating layout (desktop) ---------- */
@media (min-width:821px){
  .app{display:block;position:relative;height:100%;--safe-t:84px;--safe-b:112px;--safe-l:84px;--safe-r:396px;--panel-w:372px;--cr-h:30px}
  .map{position:fixed;inset:0;z-index:0}
  .top{position:fixed;z-index:6;top:12px;left:12px;right:12px;height:60px;border-radius:22px;padding:0 12px 0 16px}
  .rail{position:fixed;z-index:5;top:calc(var(--safe-t) + (100vh - var(--safe-t) - var(--safe-b))/2);transform:translateY(-50%);left:12px;width:50px;border-radius:20px;padding:7px 0;gap:4px}
  .panel{position:fixed;z-index:5;top:var(--safe-t);right:12px;bottom:var(--safe-b);width:var(--panel-w);border-radius:26px;padding:16px 20px 20px;gap:16px;transition:transform .32s cubic-bezier(.2,.8,.2,1),opacity .2s}
  .timeline{position:fixed;z-index:5;left:12px;right:12px;bottom:12px;height:88px;border-radius:24px;padding:0 18px}
  .panel-hide{display:grid}
  /* the step's buttons float at the foot of the panel (09-30 ask): no band, no card, no orange — each button is one dark
     liquid-glass pill like the weather chip (.glass). A second backdrop blur does not stack inside the refracting panel
     (Chromium), so the frost is a near-solid tint + the chip's top-left highlight, lit rim and shadow */
  .panel .cta{position:sticky;bottom:-8px;z-index:2;margin:auto -8px -8px;padding:10px 8px 8px;background:none;border:0;box-shadow:none}
  .panel .cta .btn:not(:disabled){background:linear-gradient(150deg,var(--hl),transparent 40%,transparent 74%,var(--hl-2)),color-mix(in srgb,var(--shell-solid) 95%,transparent);color:var(--fg);border:1px solid var(--glass-line);border-radius:18px;box-shadow:0 12px 32px rgba(0,0,0,.28),var(--rim)}
  .panel .cta .btn:not(:disabled):hover{filter:none;border-color:var(--line-2)}
  .panel .cta .note{color:var(--fg-2);text-shadow:0 0 2px var(--shell-solid),0 0 6px var(--shell-solid),0 0 12px var(--shell-solid)}
  .app.no-time{--safe-b:24px}
  .app.panel-min{--safe-r:64px}
  .app.panel-min .panel{transform:translateX(calc(100% + 24px));opacity:0;pointer-events:none;visibility:hidden;transition:transform .32s cubic-bezier(.2,.8,.2,1),opacity .2s,visibility 0s .32s}
  .panel-open:not([hidden]){display:flex;position:fixed;z-index:5;right:12px;top:var(--safe-t);flex-direction:column;align-items:center;gap:8px;padding:12px 8px;border-radius:18px;cursor:pointer;color:var(--fg);font:600 10px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase}
  .panel-open span{writing-mode:vertical-rl}
  :lang(zh) .panel-open{letter-spacing:.2em;text-transform:none}

  /* HUDs keep to the part of the map the glass leaves open */
  .wx{top:calc(var(--safe-t) + 2px);left:calc(var(--safe-l) + (100% - var(--safe-l) - var(--safe-r))/2);max-width:calc(100% - var(--safe-l) - var(--safe-r) - 24px)}
  .basemap{top:calc(var(--safe-t) + 2px);right:var(--safe-r)}
  .zoom{right:var(--safe-r);top:calc(var(--safe-t) + (100% - var(--safe-t) - var(--safe-b))/2)}
  .legend{left:var(--safe-l);bottom:calc(var(--safe-b) + var(--cr-h) + 44px)}
  .probe{right:var(--safe-r);bottom:calc(var(--safe-b) + var(--cr-h) + 54px);max-width:calc(100% - var(--safe-l) - var(--safe-r) - 300px)}
  .credits{position:fixed;z-index:4;left:calc(var(--safe-l) + (100vw - var(--safe-l) - var(--safe-r))/2);transform:translateX(-50%);bottom:calc(var(--safe-b) + 2px);width:max-content;max-width:calc(100vw - var(--safe-l) - var(--safe-r) - 24px);justify-content:center;text-align:center;text-shadow:0 0 2px var(--shell-solid),0 0 6px var(--shell-solid),0 0 12px var(--shell-solid)}
  .toast{left:calc(var(--safe-l) + (100% - var(--safe-l) - var(--safe-r))/2);bottom:calc(var(--safe-b) + var(--cr-h) + 48px)}
  .swipe .tag{top:calc(var(--safe-t) + 60px)}
}
/* narrower desktops: fewer HUDs, a slimmer panel */
@media (min-width:821px) and (max-width:1180px){ .app{--panel-w:332px;--safe-r:356px} .app.panel-min{--safe-r:64px} .basemap{top:calc(var(--safe-t) + 52px)} }
@media (min-width:821px) and (max-width:1000px){ .probe{display:none} .scene{display:none} }

/* ---------- phones / narrow: the stacked flow, glass surfaces kept ---------- */
@media (max-width:820px){
  /* its own row at the very end: left unplaced it would drop into the timeline's empty row, between the map and the panel */
  .app{grid-template-rows:auto 66vh auto auto auto;grid-template-areas:"top" "map" "time" "panel" "credits"}
  .credits{grid-area:credits;padding:12px 16px 20px;border:0;border-radius:0;box-shadow:none;background:none;-webkit-backdrop-filter:none;backdrop-filter:none}
  .top{border-radius:0 0 20px 20px;border-width:0 0 1px}
  .timeline,.panel{border-width:1px 0 0;border-radius:0}
}

/* ---------- fallbacks ---------- */
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .top,.rail,.panel,.timeline,.panel-open,.glass{background:var(--shell-solid)}
}
@media (prefers-reduced-transparency: reduce){
  .top,.rail,.panel,.timeline,.panel-open,.glass{background:var(--shell-solid);-webkit-backdrop-filter:none;backdrop-filter:none}
  .card,.list,.metric,.agents3 div,.table,.pre{background:var(--shell-solid)}
}
@media (prefers-reduced-motion: reduce){
  .panel,.app.panel-min .panel,.stepper button,.rail button,.sec-head::after{transition:none}
}

.ai-tile:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.ai-tile:disabled{cursor:default;opacity:.7}
.ai-th{display:flex;align-items:center;justify-content:space-between;gap:6px}
.ai-th .eyebrow{font-size:11px;letter-spacing:.06em;color:var(--fg-2)}
.ai-dot{flex:none;width:7px;height:7px;border-radius:50%;background:var(--works)}
.ai-dot.ok{background:var(--accent)}
.ai-dot.risk{background:var(--risk)}
.ai-ns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}
.ai-n{display:flex;flex-direction:column;gap:4px;min-width:0}
.ai-n b{font:700 19px/1 var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.ai-n b small{font-size:10px;font-weight:400;color:var(--fg-3);margin-left:1px}
.ai-n em{font-style:normal;font-size:10.5px;color:var(--fg-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ai-tadv{font-size:11.5px;color:var(--fg-2);overflow-wrap:anywhere}
.ai-tnote{font-size:11.5px;color:var(--fg-3)}
.ai-detail .ai-p{border-color:var(--accent)}
.ai-log{border:1px solid var(--line);border-radius:6px;background:var(--raised);min-width:0}
.ai-log summary{cursor:pointer;padding:9px 12px;font:600 11px/1.2 var(--f-mono);letter-spacing:.04em}
.ai-log-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:0 12px 8px}
.ai-log .ai-none{padding:0 12px 10px;margin:0}
.ai-rows{max-height:320px;overflow-y:auto;border-top:1px solid var(--line)}
.ai-row{display:flex;flex-direction:column;gap:3px;padding:7px 12px;font-size:11px;min-width:0}
.ai-row+.ai-row{border-top:1px solid var(--line)}
.ai-row .hd{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px}
.ai-row .tm,.ai-row .ms{font-family:var(--f-mono);color:var(--fg-3)}
.ai-row .tx{font-family:var(--f-mono);color:var(--works);overflow-wrap:anywhere}
.ai-row .adv{color:var(--fg-2);overflow-wrap:anywhere}
.cmp-explain{border-top:1px solid var(--line);margin-top:16px;padding-top:14px;font-size:13px;line-height:1.55;overflow-wrap:anywhere}
.cmp-explain small{display:block;opacity:.7}.cmp-explain p{margin:8px 0}.cmp-explain ul{padding-left:18px;margin:6px 0 12px}.cmp-lean{font-size:14px;line-height:1.6}
/* T45 VMS lab (6d-vmslab.js): same plan, other words on VMS-1 — one row per wording, bar = queue */
.vlab{display:flex;flex-direction:column;gap:7px}
.vlab-rows{display:flex;flex-direction:column;gap:4px}
.vlab-row{display:grid;grid-template-columns:minmax(0,1fr) 64px 54px;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:1px solid transparent;border-radius:4px;padding:6px;color:var(--fg);cursor:pointer;font:inherit;font-size:12px}
.vlab-row:hover{border-color:var(--line-2)}
.vlab-row[aria-current="true"]{border-color:var(--tint-line);background:var(--tint)}
.vlab-row .tx{min-width:0;font:500 11px/1.35 var(--f-mono);color:var(--works);overflow-wrap:anywhere}
.vlab-row .tag{font:700 9px/1 var(--f-mono);letter-spacing:.04em;font-style:normal;color:var(--accent);margin-left:6px;white-space:nowrap}
.vlab-row .tag.base{color:var(--fg-3)}.vlab-row .tag.cur{color:var(--fg-2)}
.vlab-row .track{height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.vlab-row .track i{display:block;height:100%;background:var(--fg-3);border-radius:2px}
.vlab-row.best .track i{background:var(--accent)}
.vlab-row .n{font:600 11px/1 var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}
.vlab-rec{font-size:12.5px;line-height:1.5;margin:4px 0 0}
.vlab-rec b{font-family:var(--f-mono);color:var(--works);font-weight:600}
.vlab .linkbtn{background:none;border:0;padding:0;color:var(--accent);font:inherit;text-decoration:underline;cursor:pointer}

/* T47: step 3 · SUMO result of the step-2 run, above the engine estimate */
.sumo-impact .pill{white-space:normal}
.sumo-imp{width:100%;border-collapse:collapse;font-size:12px}
.sumo-imp th,.sumo-imp td{padding:6px 8px;border-bottom:1px solid var(--line-2);text-align:right;font-variant-numeric:tabular-nums}
.sumo-imp th[scope=row],.sumo-imp thead th:first-child{text-align:left;font-weight:600}
.sumo-imp thead th{font:600 10px/1.3 var(--f-mono);letter-spacing:.04em;text-transform:uppercase;color:var(--fg-3)}
.sumo-imp tr.cur th[scope=row]{color:var(--works)}
.sumo-imp-wrap{overflow-x:auto}
/* T48: the full-hour table leads with the 09:00 queue counted the engine's way; one generated sentence sets it against the engine */
.sumo-imp.hour{font-size:11.5px}
.sumo-imp.hour th,.sumo-imp.hour td{padding:5px 4px}
.sumo-imp.hour td.k{font-weight:700;color:var(--fg)}
.sumo-imp.hour thead th{font-size:9px;letter-spacing:.02em}
.sumo-cmp{margin:0;padding:8px 10px;border-left:2px solid var(--works);font-variant-numeric:tabular-nums;display:flex;flex-direction:column;gap:6px}
.sumo-cmp p{margin:0}
.sumo-qchart{width:100%;height:auto;display:block;overflow:visible}
.sumo-qchart polyline,.sumo-qchart line{fill:none;stroke-width:1.6;vector-effect:non-scaling-stroke}
.sumo-qchart .ax{stroke:var(--line-2);stroke-width:1}
.sumo-qchart .eng{stroke:var(--risk);stroke-dasharray:4 3}
.sumo-qchart .equiv{stroke:var(--works);stroke-width:2}
.sumo-qchart .phys{stroke:var(--fg-3)}
.sumo-qchart text{font:500 8px var(--f-mono);fill:var(--fg-3)}
.sumo-qkey{display:flex;flex-wrap:wrap;gap:4px 10px;color:var(--fg-3)}
.sumo-qkey i{display:inline-block;width:12px;height:0;border-top:2px solid;vertical-align:middle;margin-right:4px}
.sumo-qkey i.equiv{border-color:var(--works)}
.sumo-qkey i.phys{border-color:var(--fg-3)}
.sumo-qkey i.eng{border-color:var(--risk);border-top-style:dashed}
</style>

<script>
'use strict';
/* ============================================================
   Language: English / 简体中文. L(en, zh) picks the active string.
   Static markup carries its Chinese text in data-zh / data-zh-* attributes.
   ============================================================ */
const LANG={cur:'en'};
const L=(en,zh)=>LANG.cur==='zh'?zh:en;
function applyLangDom(){
  document.documentElement.lang=LANG.cur==='zh'?'zh-CN':'en';
  document.querySelectorAll('[data-zh]').forEach(el=>{if(el.dataset.en==null)el.dataset.en=el.textContent;el.textContent=LANG.cur==='zh'?el.dataset.zh:el.dataset.en;});
  for(const attr of['aria-label','data-tip','title']){
    const key='zh'+attr.replace(/(^|-)(\w)/g,(m,a,c)=>c.toUpperCase());
    document.querySelectorAll(`[data-zh-${attr}]`).forEach(el=>{const enKey='en'+key.slice(2);if(el.dataset[enKey]==null)el.dataset[enKey]=el.getAttribute(attr)||'';el.setAttribute(attr,LANG.cur==='zh'?el.dataset[key]:el.dataset[enKey]);});
  }
}

/* ============================================================
   Utilities
   ============================================================ */
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const smooth=t=>t<=0?0:t>=1?1:t*t*(3-2*t);
function rng(seed){let a=seed>>>0;return()=>{a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296;};}
function hash2(x,y,s){let h=(Math.imul(x|0,374761393)+Math.imul(y|0,668265263)+Math.imul(s|0,1442695041))|0;h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return(h>>>0)/4294967296;}
function vnoise(x,y,s,P){
  const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;let x0=xi,y0=yi,x1=xi+1,y1=yi+1;
  if(P){x0=((x0%P)+P)%P;y0=((y0%P)+P)%P;x1=((x1%P)+P)%P;y1=((y1%P)+P)%P;}
  const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  const a=hash2(x0,y0,s),b=hash2(x1,y0,s),c=hash2(x0,y1,s),d=hash2(x1,y1,s);
  return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;
}
function fbm(x,y,oct,s,P){let t=0,amp=.5,f=1,n=0;for(let i=0;i<oct;i++){t+=amp*vnoise(x*f,y*f,(s||0)+i*31,P?P*f:0);n+=amp;amp*=.5;f*=2;}return t/n;}
const hexRgb=h=>{h=String(h).trim().replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];};
const rgba=(c,a)=>{const[r,g,b]=Array.isArray(c)?c:hexRgb(c);return`rgba(${r|0},${g|0},${b|0},${a})`;};
function makeRamp(stops){const s=stops.map(([t,c])=>[t,hexRgb(c)]);const f=t=>{t=clamp(t,0,1);for(let i=1;i<s.length;i++)if(t<=s[i][0]){const[t0,c0]=s[i-1],[t1,c1]=s[i],k=(t-t0)/((t1-t0)||1);return[c0[0]+(c1[0]-c0[0])*k,c0[1]+(c1[1]-c0[1])*k,c0[2]+(c1[2]-c0[2])*k];}return s[s.length-1][1];};f.stops=stops;return f;}
const RAMPS={
  inferno:makeRamp([[0,'#0D0829'],[.13,'#2A0B5A'],[.25,'#50127B'],[.38,'#78207F'],[.5,'#9F2F7F'],[.62,'#C73D73'],[.72,'#E85A5B'],[.82,'#F8813F'],[.92,'#FDB32F'],[1,'#F9E86B']]),
  depth:makeRamp([[0,'#B4E1FF'],[.3,'#5AAEFF'],[.65,'#2C7BE5'],[1,'#0B3D91']]),
  wind:makeRamp([[0,'#3288BD'],[.25,'#99D594'],[.5,'#FFFFBF'],[.75,'#FC8D59'],[1,'#D53E4F']]),
  windLight:makeRamp([[0,'#1F5F8B'],[.25,'#2F8A4E'],[.5,'#A88400'],[.75,'#D2601A'],[1,'#B01218']]),
  risk:makeRamp([[0,'#1B3BFF'],[.35,'#00C2FF'],[.55,'#FFD23F'],[.75,'#FF8A3D'],[1,'#FF3B4E']]),
  fog:makeRamp([[0,'#F4F7F9'],[1,'#5E707C']]),
};
/* NWS-style radar reflectivity colour table */
const DBZ=[[5,'#04E9E7'],[10,'#019FF4'],[15,'#0300F4'],[20,'#02FD02'],[25,'#01C501'],[30,'#008E00'],[35,'#FDF802'],[40,'#E5BC00'],[45,'#FD9500'],[50,'#FD0000'],[55,'#D40000'],[60,'#BC0000'],[65,'#F800FD']].map(([d,c])=>[d,hexRgb(c),c]);
function dbzRgb(d){let c=null;for(const e of DBZ){if(d>=e[0])c=e[1];else break;}return c;}

/* marching squares → flat segment list in grid coordinates (cell centres) */
function contour(G,nx,ny,level){
  const seg=[];
  for(let j=0;j<ny-1;j++){const r0=j*nx,r1=r0+nx;for(let i=0;i<nx-1;i++){
    const a=G[r0+i],b=G[r0+i+1],c=G[r1+i+1],d=G[r1+i];
    let k=0;if(a>level)k|=1;if(b>level)k|=2;if(c>level)k|=4;if(d>level)k|=8;
    if(k===0||k===15)continue;
    const f=(p,q)=>(level-p)/((q-p)||1e-9);
    const T=[i+f(a,b),j],Rr=[i+1,j+f(b,c)],B=[i+f(d,c),j+1],L=[i,j+f(a,d)];
    let s;
    switch(k){case 1:case 14:s=[L,T];break;case 2:case 13:s=[T,Rr];break;case 3:case 12:s=[L,Rr];break;case 4:case 11:s=[Rr,B];break;case 6:case 9:s=[T,B];break;case 7:case 8:s=[L,B];break;case 5:s=[L,T,Rr,B];break;case 10:s=[T,Rr,L,B];break;}
    for(let m=0;m<s.length;m+=2)seg.push(s[m][0],s[m][1],s[m+1][0],s[m+1][1]);
  }}
  return seg;
}
function hull(pts){
  pts=pts.slice().sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
  const cr=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]);
  const lo=[],up=[];
  for(const p of pts){while(lo.length>=2&&cr(lo[lo.length-2],lo[lo.length-1],p)<=0)lo.pop();lo.push(p);}
  for(let i=pts.length-1;i>=0;i--){const p=pts[i];while(up.length>=2&&cr(up[up.length-2],up[up.length-1],p)<=0)up.pop();up.push(p);}

function vecRgb(b,pal){let c=mixRgb(hexRgb(pal.bldg),hexRgb(pal.bldgTall),clamp((b.h-10)/120,0,1));const u=pal.use&&pal.use[b.use];if(u)c=mixRgb(c,hexRgb(u),.35);return c;}

function drawVector(c,V,W,pal){
  const X=x=>V.X(x),Y=y=>V.Y(y),s=V.s;
  const rect=(r,col)=>{c.fillStyle=col;c.fillRect(X(r.x0),Y(r.y1),(r.x1-r.x0)*s,(r.y1-r.y0)*s);};
  c.fillStyle=pal.land;c.fillRect(0,0,V.w,V.h);
  for(const st of W.streets)rect(streetRect(st),pal.foot);
  for(const st of W.streets){const r=carriage(st);rect(r,pal.road);}
  c.strokeStyle=pal.casing;c.lineWidth=1;
  for(const st of W.streets){const r=carriage(st);if(st.axis==='h'){for(const y of[r.y0,r.y1]){c.beginPath();c.moveTo(0,Y(y));c.lineTo(V.w,Y(y));c.stroke();}}else{for(const x of[r.x0,r.x1]){c.beginPath();c.moveTo(X(x),0);c.lineTo(X(x),V.h);c.stroke();}}}
  for(const l of W.lanes)rect(l,pal.lane);
  for(const st of W.streets){
    const H=st.axis==='h';
    if(st.bike)for(const sg of[-1,1])for(const[a,b]of freeSpans(st,1)){const lo=st.c+Math.min(sg*8.25,sg*10.5),hi=st.c+Math.max(sg*8.25,sg*10.5);rect(H?{x0:a,x1:b,y0:lo,y1:hi}:{x0:lo,x1:hi,y0:a,y1:b},pal.bike);}
    if(st.tram&&s>1.6){c.strokeStyle=pal.tram;c.lineWidth=Math.max(1,s*.25);c.setLineDash([Math.max(3,s*1.2),Math.max(2,s*.8)]);for(const o of[-2,2]){c.beginPath();if(H){c.moveTo(0,Y(st.c+o));c.lineTo(V.w,Y(st.c+o));}else{c.moveTo(X(st.c+o),0);c.lineTo(X(st.c+o),V.h);}c.stroke();}c.setLineDash([]);}
    if(st.main&&s>3){c.strokeStyle=pal.marking;c.lineWidth=1;c.setLineDash([s*3,s*6]);for(const o of(st.tram?[-4.2,4.2]:[-3.6,3.6,-7.2,7.2]))for(const[a,b]of freeSpans(st,4)){c.beginPath();if(H){c.moveTo(X(a),Y(st.c+o));c.lineTo(X(b),Y(st.c+o));}else{c.moveTo(X(st.c+o),Y(a));c.lineTo(X(st.c+o),Y(b));}c.stroke();}c.setLineDash([]);}
  }
  if(s>2.4)for(const h of W.streets.filter(q=>q.axis==='h'&&q.w>=20))for(const v of W.streets.filter(q=>q.axis==='v'&&q.w>=20)){const hw=h.w/2-h.fp,vw=v.w/2-v.fp;for(const sg of[-1,1]){const xc=v.c+sg*(v.w/2+2.2);for(let y=h.c-hw+.3;y<h.c+hw-.3;y+=1.1)rect({x0:xc-1.8,x1:xc+1.8,y0:y,y1:y+.55},pal.zebra);const yc=h.c+sg*(h.w/2+2.2);for(let x=v.c-vw+.3;x<v.c+vw-.3;x+=1.1)rect({x0:x,x1:x+.55,y0:yc-1.8,y1:yc+1.8},pal.zebra);}}
  for(const p of W.platforms)rect(p,pal.platform);
  for(const p of W.plazas)rect(p,pal.plaza);
  for(const p of W.parks)rect(p,pal.park);
  c.strokeStyle=pal.foot;c.lineWidth=Math.max(1,s*2);for(const pth of W.paths){c.beginPath();c.moveTo(X(pth[0][0]),Y(pth[0][1]));c.lineTo(X(pth[1][0]),Y(pth[1][1]));c.stroke();}
  /* buildings with a soft extrusion */
  const off=b=>X(b.x1)<-40||X(b.x0)>V.w+40||Y(b.y0)<-40||Y(b.y1)>V.h+40;
  const vpath=(P,ox,oy)=>{c.beginPath();P.forEach((p,i)=>i?c.lineTo(X(p[0]+ox),Y(p[1]+oy)):c.moveTo(X(p[0]+ox),Y(p[1]+oy)));c.closePath();};
  for(const b of W.buildings){const e=Math.min(b.h,90)*.045;c.fillStyle=pal.bldgSide;if(b.pts){if(off(b))continue;vpath(b.pts,e*.8,-e);c.fill();}else c.fillRect(X(b.x0+e*.8),Y(b.y1-e),(b.x1-b.x0)*s,(b.y1-b.y0)*s);}
  for(const b of W.buildings){

  for(const l of W.landmarks){c.fillStyle=l.kind==='dome'?pal.dome:l.kind==='cone'?pal.glass:pal.bldgEdge;c.strokeStyle=pal.bldgEdge;c.beginPath();c.arc(X(l.x),Y(l.y),l.r*s,0,Math.PI*2);c.fill();c.stroke();}
  c.fillStyle=pal.tree;for(const t of W.trees){c.beginPath();c.arc(X(t.x),Y(t.y),t.r*s*.8,0,Math.PI*2);c.fill();}
}

const TYPES={

  clear:{v:1,T:1,b:1,ped:1,bike:1,wob:0,rate:1},
  storm:{v:.82,T:1.4,b:.72,ped:1.12,bike:.85,wob:.15,rate:.9},

function mkPath(pts){const cum=[0];for(let i=1;i<pts.length;i++)cum.push(cum[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]));return{pts,cum,L:cum[cum.length-1]};}

  add('EBL',{type:'car',pts:[[-E,6.6],[-17,6.6],...bez([-17,6.6],[-6.6,6.6],[-6.6,17],8),[-6.6,E]],rate:.035,grp:'EW',stopAxis:'x',stopVal:-20.5});
  add('TLE',{type:'tram',pts:[[-E,2],[E,2]],rate:1/80,grp:'EW',stopAxis:'x',stopVal:-20.5});

  add('BSS',{type:'bike',pts:[[9.4,E],[9.4,-E]],rate:.05,grp:'NS',stopAxis:'y',stopVal:20.5});
  /* pedestrians: footpaths with signalised crossings */

  const rev=a=>a.slice().reverse();

/* g / imgs: grids and imagery already built for nw (loadBuildings makes them in earlier tasks); missing ones are rebuilt here */
function rebuildWorld(nw,g,imgs){
  W=nw;G=g||buildGrids(nw);WX.rebind(W,G);
  for(const k of Object.keys(IMG))delete IMG[k];
  if(imgs)Object.assign(IMG,imgs);

/* same-origin data from T3 (apps/roads). Fails on file://, the web-only static server or offline → the synthetic city stays.
   The swap runs in separate tasks (footprints → grids → imagery → swap): when the data lands after the page started, the
   animation keeps drawing the old city in between and the map flips to the real one in a single frame, instead of one
   ~0.4 s freeze. Before the first frame it just finishes a few ms later. */
const nextTask=()=>new Promise(r=>setTimeout(r,0));
function loadBuildings(){
  return fetch('/roads/public/cbd/buildings.json').then(r=>r.ok?r.json():null).then(async d=>{
    cityData(d); // the whole-CBD layer draws every footprint (6c-city.js); the fine window clips its copy to WORLD
    const nw=d?buildWorldReal(d,geoToWorld):null;
    if(!nw||nw.buildings.length<REAL_MIN)return false;
    await nextTask();const g=buildGrids(nw);
    await nextTask();const bm=S.basemap,imgs=bm==='streets'?null:{[bm]:renderImagery(nw,bm==='nir'?PAL_NIR:PAL_RGB)};
    await nextTask();rebuildWorld(nw,g,imgs);console.info('buildings: real footprints',nw.count);return true;
  }).catch(e=>{console.info('buildings: synthetic city',e&&e.message);return false;});
}
/* The real OSM vector basemap for the whole-CBD layer (T35, /roads/public/cbd/vectormap.json): water, green space, land use
   and rail from OpenFreeMap's OpenMapTiles vector tiles. Only the CITY layer draws it, so it loads on its own rather than
   joining loadBuildings()' first-frame race — the city layer re-renders itself when it lands. Same failure story: same-origin
   only, and a miss just leaves the flat city layer as it was. */
function loadVectorMap(){
  return fetch('/roads/public/cbd/vectormap.json').then(r=>r.ok?r.json():null).then(d=>{
    cityVector(d);if(d)console.info('vectormap: real OSM vector basemap',d.polygons.length+' polygon layers /',d.lines.length+' line layers');return !!d;
  }).catch(e=>{console.info('vectormap: plain city layer',e&&e.message);return false;});
}

/* ---------- histogram ---------- */
const hc=$('#hist'),hctx=hc.getContext('2d');let hw=0,hh=0;
function sizeHist(){const r=hc.getBoundingClientRect();hw=r.width;hh=r.height;const d=Math.min(2,devicePixelRatio||1);hc.width=Math.max(1,Math.round(hw*d));hc.height=Math.max(1,Math.round(hh*d));hctx.setTransform(d,0,0,d,0,0);}
function drawHist(){
  if(!hw)return;const c=hctx;c.clearRect(0,0,hw,hh);const top=4,bot=hh-16,bw=hw/60,sim=S.sim,live=sim?sim.minute:null;
  const su=sim&&sim.isSumo&&sim.bins?sim.bins.n:0,aria=su?L(`Share of vehicles into the works junctions that braked harshly, per ${su} minutes (SUMO: conflicts not computed). Click to jump.`,`每 ${su} 分钟驶入施工处路口的车里，急刹的占比（SUMO 不算冲突）。点击可跳转。`):sim&&sim.mSeen?L('Share of vehicles into the works junctions that braked harshly or were in a conflict, per 10 minutes. Click to jump.','每 10 分钟驶入施工处路口的车里，急刹或卷入冲突的占比。点击可跳转。'):L('Conflicts per minute, 17:00 to 18:00. Click to jump.','17:00–18:00 每分钟冲突数，点击可跳转');
  if(hc.getAttribute('aria-label')!==aria)hc.setAttribute('aria-label',aria);
  if(sim&&sim.mSeen)histShare(c,sim,top,bot); // 4×4 grid sim, and the SUMO replay since T46
  else{ // La Trobe scene: conflicts per minute, scaled to the busiest minute so far (at least 3, the old full height), so
        // minutes can be told apart
    let top1=0;if(live)for(let m=0;m<60;m++)top1=Math.max(top1,live[m]);const mx=Math.max(3,top1);
    for(let m=0;m<60;m++){c.fillStyle=TK.line;c.fillRect(m*bw+1,bot-2,bw-2,2);
      const v=live?live[m]:0;if(v>0){const lh=(bot-top)*v/mx;c.fillStyle=v>=2?TK.risk:TK.works;c.fillRect(m*bw+1,bot-lh,bw-2,lh);}}}
  c.fillStyle=TK.line2;c.fillRect(0,bot,hw,1);c.font=`400 9px ${FONT_MONO}`;c.fillStyle=TK.fg3;c.textBaseline='top';
  const H=clockHour();for(let k=0;k<=6;k++){const x=k*hw/6;c.textAlign=k===0?'left':k===6?'right':'center';c.fillText(k===6?`${String((H+1)%24).padStart(2,'0')}:00`:`${String(H).padStart(2,'0')}:${String(k*10).padStart(2,'0')}`,x,bot+4);}
  const px=S.clock/3600*hw;c.fillStyle=TK.accent;c.fillRect(px-1,top-2,2,bot-top+4);
}
// T44 step 2 (4×4): one bar per 10 minutes, all the same height = the vehicles that entered the 2×2 in them; red = the share
// that braked harshly or were in a conflict there, grey = the rest (through without either). Each part carries its share.
// T46: the SUMO replay sets sim.bins {m0, n}: n-minute bars from minute m0 (T48: the full hour 10 minutes from 08:00, as here;
// a 12-minute replay 2 minutes from 08:03, 6 bars), each over its own minutes on the hour axis the clock hand runs along. A label too wide for its slot drops to whole percent, then goes
function histShare(c,sim,top,bot){
  const B=sim.bins||{m0:0,n:10},mw=hw/60,W=B.n*mw,bw=Math.min(W*(B.n<10?.7:.42),96),H=bot-top;
  c.fillStyle=TK.line;c.fillRect(0,Math.round(top+H/2),hw,1); // 50 %
  c.font=`500 9.5px ${FONT_MONO}`;c.textAlign='center';c.textBaseline='middle';
  const pct=v=>{for(const d of[1,0]){const s=`${(v*100).toFixed(d)}%`;if(c.measureText(s).width<=W-2)return s;}return'';};
  for(let m0=B.m0-Math.ceil(B.m0/B.n)*B.n;m0<60;m0+=B.n){
    let seen=0,hit=0;for(let m=Math.max(0,m0);m<Math.min(60,m0+B.n);m++){seen+=sim.mSeen[m];hit+=sim.mHit[m];}if(!(seen>0))continue;
    const p=Math.min(1,hit/seen),x=m0*mw+(W-bw)/2,cx=x+bw/2,hr=H*p,inRed=hr>=13;
    c.globalAlpha=.45;c.fillStyle=TK.fg3;c.fillRect(x,top,bw,H-hr);c.globalAlpha=.9;c.fillStyle=TK.risk;c.fillRect(x,bot-hr,bw,hr);c.globalAlpha=1;
    if(inRed){c.fillStyle=TK.fg;c.fillText(pct(p),cx,bot-hr/2);}else{c.fillStyle=TK.risk;c.fillText(pct(p),cx,bot-hr-7);} // a thin red part: its share just above it
    const g1=inRed?bot-hr:bot-hr-14;if(g1-top>=12){c.fillStyle=TK.fg;c.fillText(pct(1-p),cx,(top+g1)/2);}
  }
}
// The 1 h sim window's hour: the plan's hour on the step-2 grid sim (T38; it runs that hour's flows), else the La Trobe scene's 17:00
function clockHour(){return gridShown()?(S.sim.isSumo?S.sim.hour:clamp(Math.floor(+EP.hour||0),0,23)):17;} // T40: a SUMO replay runs its own hour (index.hour)
const fmtClock=s=>{s=Math.floor(s);return`${String(clockHour()).padStart(2,'0')}:${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;};

/* ---------- main loop ---------- */
let last=performance.now(),uiT=0,histT=0,legT=0,probeKey='';
const PLAY='<svg width="14" height="16" viewBox="0 0 14 16"><path d="M2 1.5l10.5 6.5L2 14.5z" fill="currentColor"/></svg>',PAUSE='<svg width="14" height="16" viewBox="0 0 14 16"><path d="M2 1.5h3.5v13H2zM8.5 1.5H12v13H8.5z" fill="currentColor"/></svg>';
function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(S.fly)stepFly(dt);
  let sp=S.playing?S.speed:0;
  if(S.slow>0){S.slow-=dt;sp=.2;if(S.slow<=0){S.playing=false;sp=0;onCritical();}}
  if(sp>0){const sd=dt*sp,n=Math.ceil(sd/.05),h=sd/n;for(let i=0;i<n;i++)for(const s of activeSims())s.step(h);S.clock=Math.min(3599,S.clock+sd);if(S.clock>=3599)S.playing=false;}
  if(S.sim&&S.sim.isSumo){S.clock=S.sim.clock();if(S.sim.atEnd)S.playing=false;} // T40: the clock reads the replay's own time; T48: the full hour stops at its end, as the grid sim at 09:00
  WX.clock=fmtClock(S.clock);WX.update(dt,S.clock/3600);
  if(S.step===2&&S.sim&&S.sim.critical&&!S.alertShown){S.alertShown=true;S.slow=1.2;}
  render(dt);placeAlert();
  if(S.step===4){const sw=$('#swipe');if(!sw.hidden)sw.style.left=(S.swipe*V.w)+'px';}
  uiT+=dt;histT+=dt;legT+=dt;
  if(toastT>0){toastT-=dt;if(toastT<=0)$('#toast').hidden=true;}
  if(histT>.2){histT=0;drawHist();}
  if(uiT>.25){uiT=0;updateLive();$('#clock').textContent=fmtClock(S.clock);const pb=$('#play'),icn=S.playing?PAUSE:PLAY;if(pb.dataset.i!==String(S.playing)){pb.innerHTML=icn;pb.dataset.i=String(S.playing);pb.setAttribute('aria-label',S.playing?L('Pause simulation','暂停仿真'):L('Play simulation','播放仿真'));}
    document.querySelectorAll('#speed button').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.speed===S.speed)));}
  if(legT>.5){legT=0;updateLegendLive();}
  {const pb=$('#probe'),hide=V.s<1;if(pb&&pb.hidden!==hide)pb.hidden=hide;} // T27: lat/lon readout only in the fine zooms
  if(S.mouse){const x=V.wx(S.mouse[0]),y=V.wy(S.mouse[1]),key=`${x.toFixed(1)},${y.toFixed(1)},${S.wx},${(WX.t*2)|0}`;if(key!==probeKey){probeKey=key;const ll=toLL(x,y);$('#pLat').textContent=dms(ll[0],'N','S');$('#pLon').textContent=dms(ll[1],'E','W');const p=WX.probe(x,y);$('#pVal').textContent=p?`${p.v} · ${p.n}`:L('outside the scene','场景范围外');}}
  requestAnimationFrame(loop);
}

/* ============================================================
   Engine wiring (T13, docs/hackathon/specs/T13-web-wiring-PRD.md): the plan on the real CBD network → /engine/public/js/backend.js
   → numbers the panel shows (queue, detour split, per-type delay, advisor, before / after).
   Backend not reachable (file://, a static server that only serves apps/web/public, offline) → BE.err is set and

/* pure:begin — tests/test_engine.py runs this block in node */
// Real lat/lon → page world metres (x east, y north along the Hoddle grid). Least-squares affine on the 24 main-grid
// intersections Queen…Exhibition × Bourke…La Trobe in /roads/public/cbd/network.json (max error 1.4 m). North of La Trobe
// the page draws its blocks taller than real: Little La Trobe 55 m → 100, A'Beckett 109 m → 200.
const GEO_X=[71450.68617987254,32740.96975681178,-9119842.750837393],GEO_Y=[-26214.61073382881,89740.68366610732,7193228.539331512];
function geoToWorld(lat,lon){const x=GEO_X[0]*lon+GEO_X[1]*lat+GEO_X[2],v=GEO_Y[0]*lon+GEO_Y[1]*lat+GEO_Y[2];return[x,v<=0?v:v<55?v*100/55:v<109?100+(v-55)*100/54:200+(v-109)*100/54];}
// Streets a work zone can't sit on (same list the engine won't detour through)
const NO_WORKS=new Set(['living_street','pedestrian','service','track','footway','cycleway','path']);
function linkPts(l){const g=l&&l.geometry;if(!Array.isArray(g)||g.length<2)return null;return g.map(p=>geoToWorld(p[0],p[1]));}
// Compass letter of a link's direction of travel on the page grid
function dirOf(P){const dx=P[P.length-1][0]-P[0][0],dy=P[P.length-1][1]-P[0][1];return Math.abs(dx)>=Math.abs(dy)?(dx>=0?'E':'W'):(dy>=0?'N':'S');}
// Nearest link to world point (x, y) within tol metres. cands = [{ id, pts, hw }].
// A two-way street is two links on one line; traffic keeps left, so a click left of a link's direction of travel picks that link.
function pickLink(cands,x,y,tol){
  let best=null,bs=Infinity;
  for(const c of cands){
    if(!c.pts||NO_WORKS.has(c.hw))continue;const P=c.pts;
    for(let i=0;i<P.length-1;i++){
      const ax=P[i][0],ay=P[i][1],dx=P[i+1][0]-ax,dy=P[i+1][1]-ay,L2=dx*dx+dy*dy||1e-9;
      let t=((x-ax)*dx+(y-ay)*dy)/L2;t=t<0?0:t>1?1:t;
      const d=Math.hypot(ax+t*dx-x,ay+t*dy-y);if(d>tol)continue;
      const sc=d+(dx*(y-ay)-dy*(x-ax)>0?0:3);
      if(sc<bs){bs=sc;best=c.id;}
    }
  }
  return best;
}
// One VMS frame from a textarea: one line per row, upper case, single spaces, blank rows dropped
function parseFrame(text){return String(text||'').toUpperCase().split('\n').map(s=>s.trim().replace(/\s+/g,' ')).filter(Boolean);}
const WORKS_TIME={from:'2026-10-05',to:'2026-10-09',hours:[7,19]};
// Page state → the plan the engine takes (docs/reference/interfaces.md §Worksite plan). An empty VMS / sign is left out, not sent blank.
function planFrom(ep){
  const frames=[parseFrame(ep.f1),parseFrame(ep.f2)].filter(f=>f.length),eq=[];
  if(frames.length)eq.push({id:'VMS-1',type:'vms',at_m:ep.vmsAt,frames});
  const sign=String(ep.sign||'').toUpperCase().trim().replace(/\s+/g,' ');
  if(sign)eq.push({id:'S-1',type:'sign',at_m:ep.signAt,text:sign});
  eq.push({id:'A-1',type:'arrow',at_m:ep.arrowAt},{id:'B-1',type:'barrier',at_m:0});
  const tm=ep.time||WORKS_TIME;
  const closes={lanes:ep.lanes};if(ep.foot==='left'||ep.foot==='right'||ep.foot==='both')closes.footpath=ep.foot; // absent = footpath open
  return{when:{date:'2026-10-06',hour:ep.hour},worksites:[{id:'W-1',name:`${ep.street||'Road'} lane closure`,links:[ep.link],closes,
    time:{from:tm.from,to:tm.to,hours:[tm.hours[0],tm.hours[1]]},equipment:eq}]};
}
// A whole plan (e.g. an advisor option) → the form fields planFrom() reads. By type, not id: the advisor adds a VMS of
// its own (id vms-new) when the plan had none. Only fields the plan has are returned.
function formFromPlan(plan){
  const ws=plan&&plan.worksites&&plan.worksites[0],out={};if(!ws)return out;const eq=ws.equipment||[];
  const vms=eq.find(e=>e.id==='VMS-1')||eq.find(e=>e.type==='vms');
  if(vms){out.vmsAt=vms.at_m;out.f1=(vms.frames&&vms.frames[0]||[]).join('\n');out.f2=(vms.frames&&vms.frames[1]||[]).join('\n');}
  const sign=eq.find(e=>e.id==='S-1')||eq.find(e=>e.type==='sign');if(sign){out.signAt=sign.at_m;out.sign=sign.text||'';}
  const arrow=eq.find(e=>e.type==='arrow');if(arrow)out.arrowAt=arrow.at_m;
  if(ws.time)out.time={from:ws.time.from,to:ws.time.to,hours:[ws.time.hours[0],ws.time.hours[1]]};
  if(ws.closes)out.foot=ws.closes.footpath||'none';
  return out;
}
// Page units per real metre: geoToWorld() draws 1 m of the Hoddle grid as ~0.862 units (network.json south of La Trobe:
// east–west 0.8645, north–south 0.8600). The scale bar and anything given in metres go through it (T27)
const K_UPM=0.862;
const unitV=(a,b)=>{const dx=b[0]-a[0],dy=b[1]-a[1],l=Math.hypot(dx,dy)||1;return[dx/l,dy/l];};
// Links by the node they end at — upstreamPath() walks it
function upstreamIndex(links){const m=new Map();for(const l of links){const a=m.get(l.to);if(a)a.push(l);else m.set(l.to,[l]);}return m;}
// The queue's road (T27): from the works link's start, walk upstream along links of the same street (the one that carries on
// straightest), adding their real length len_m, until maxM metres or the street runs out in the network. pts = page points
// from the works start going upstream; cum = metres at each point; reach = metres the street allows (the sum of the links'
// len_m); end = the cross street where it runs out (null if it didn't). A line drawn on it is never longer than those links.
function upstreamPath(byTo,link,maxM){
  const P0=linkPts(link);if(!P0)return{pts:[],cum:[],reach:0,end:null,ids:[]};
  const pts=[P0[0]],cum=[0],ids=[];let cur=link,m=0,dir=unitV(P0[0],P0[P0.length-1]),ran=true;
  for(let guard=0;m<maxM&&guard<80;guard++){
    const ups=(byTo.get(cur.from)||[]).filter(u=>u.name===link.name&&u.from!==cur.to&&u.id!==cur.id);
    let U=null,best=0,G=null;
    for(const u of ups){const g=linkPts(u);if(!g)continue;const d=unitV(g[0],g[g.length-1]),dot=d[0]*dir[0]+d[1]*dir[1];if(dot>best){best=dot;U=u;G=g;}}
    if(!U){ran=false;break;} // no same-street link carrying on: the street ends here in the network
    let tot=0;for(let i=1;i<G.length;i++)tot+=Math.hypot(G[i][0]-G[i-1][0],G[i][1]-G[i-1][1]);
    let acc=0;for(let i=G.length-1;i>0;i--){acc+=Math.hypot(G[i][0]-G[i-1][0],G[i][1]-G[i-1][1]);pts.push(G[i-1]);cum.push(m+(tot?acc/tot:1)*(+U.len_m||0));}
    m+=+U.len_m||0;ids.push(U.id);dir=unitV(G[0],G[G.length-1]);cur=U;
  }
  let end=null;if(!ran)for(const u of byTo.get(cur.from)||[])if(u.name&&u.name!==link.name){end=u.name;break;}
  return{pts,cum,reach:m,end,ids}; // ids: the links walked, whose len_m add up to reach
}
// Links drawn as this plan's ripple (T27 + T28): ≥ 2 vehicle-minutes over the same hour without the works (extra_min), not the
// works link itself. sev 2 = red (a queue on it, or ≥ 60), 1 = amber (≥ 10), 0 = faint. Background queues (Flinders / King St
// every morning) have extra_min ≈ 0 and are left out, however long they are against free flow
function rippleLinks(links,worksId){const out=[];for(const l of links||[]){const ex=+l.extra_min;if(!(ex>=2)||l.id===worksId)continue;out.push({id:l.id,ex,sev:ex>=60?2:ex>=10?1:0});}return out;}
// Point m metres up the path (clamped to its end), and the path from the works start to that point
function pathAt(p,m){const{pts,cum}=p;if(!pts.length)return null;if(m<=0)return pts[0];for(let i=1;i<pts.length;i++)if(cum[i]>=m){const t=(m-cum[i-1])/((cum[i]-cum[i-1])||1);return[pts[i-1][0]+(pts[i][0]-pts[i-1][0])*t,pts[i-1][1]+(pts[i][1]-pts[i-1][1])*t];}return pts[pts.length-1];}
function pathSub(p,m){const out=[p.pts[0]];for(let i=1;i<p.pts.length&&p.cum[i]<m;i++)out.push(p.pts[i]);const e=pathAt(p,m);if(e&&out.length&&(e[0]!==out[out.length-1][0]||e[1]!==out[out.length-1][1]))out.push(e);return out;}
/* pure:end */

// Frame the work zone, its queue and every detour taking ≥ 1 % (clamped to CITY), sized to the part of the map the

function engFit(){
  if(!EP.pts)return null;const xs=[],ys=[],add=p=>{xs.push(clamp(p[0],CITY.x0,CITY.x1));ys.push(clamp(p[1],CITY.y0,CITY.y1));};
  EP.pts.forEach(add);const s=engSumFor('now'),sh=new Map(((s&&s.routes)||[]).map(r=>[r.id,r.share||0]));
  if(s&&s.queue_m>0)engSub(Math.min(s.queue_m,engReach())).forEach(add);
  if(typeof sumo3Fit==='function')sumo3Fit().forEach(add); // SUMO plan: the 03 framing includes SUMO's queue
  // every detour drawn clearly (≥ 1 %) is framed: with sign readings the three Lonsdale detours sit at 4–5 %, and a line cut at
  // the window edge reads as a bug (T27 acceptance) — the old ≥ 5 % cut them off
  for(const r of EP.alts)if((sh.get(r.id)||0)>=.01)for(const P of r.polys)P.forEach(add);

// [cx, cy, scale] that fits the world box x0–x1 × y0–y1 in the open map, for flyTo(): clear of the glass insets and
// (T49: shared by engFit and gridFit) —
// phones have no glass insets, but the weather bar sits on top of the map and the legend at its foot: keep clear of both
// desktop: the weather legend (folded) and the credits line sit at the foot of the open map — keep the framing above them
function fitView(x0,x1,y0,y1,maxS){
  const mob=!matchMedia('(min-width: 821px)').matches,lg=document.getElementById('legend'),mt=mob?96:0,mb=mob?104:(lg&&lg.offsetHeight?lg.offsetHeight+52:0);
  const I=insets(),vw=Math.max(120,V.w-I.l-I.r),vh=Math.max(120,V.h-I.t-I.b-mt-mb);
  const sc=clamp(Math.min(vw/(x1-x0),vh/(y1-y0)),cityMinS(),maxS);

   own routes (now_min, turn_m) and delay, so a sign never claims more minutes than the engine gives.
